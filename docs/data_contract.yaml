# column that uses either -- guarded by tests/test_contract_collab_tables.py so a future edit
# cannot drop the window name silently (this is the exact failure mode the "109% ERC share" defect
# and the sdg.parquet-basis discovery both trace back to). Added derived_views.dynamics_2br:
