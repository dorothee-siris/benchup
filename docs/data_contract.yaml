      - {name: vol_frac_2020, dtype: float32, meaning: "fractional work count, year 2020"}
      - {name: vol_full_2021, dtype: int16, meaning: null}
      - {name: vol_frac_2021, dtype: float32, meaning: null}
      - {name: vol_full_2022, dtype: int16, meaning: null}
      - {name: vol_frac_2022, dtype: float32, meaning: null}
      - {name: vol_full_2023, dtype: int16, meaning: null}
      - {name: vol_frac_2023, dtype: float32, meaning: null}
      - {name: vol_full_2024, dtype: int16, meaning: null}
      - {name: vol_frac_2024, dtype: float32, meaning: null}
      - {name: vol_full_2025, dtype: int16, meaning: "2025 is the labeled BONUS year (config.yaml bonus_year): trends/volume only, excluded from impact indicators (composition skew)"}
      - {name: vol_frac_2025, dtype: float32, meaning: null}
    trend_slices: "subfield x year and topic x year trend lines are DERIVABLE in-app by summing vol_full_<year>/vol_frac_<year> over topics_dim.subfield_id joined on topic_id -- see derived_views below and ARTEFACT_GAP_AUDIT.md (field-level trajectories are NOT derivable: fields.parquet and derive.py's fields_df never carry by-year columns)."

  # ---- topics_dim.parquet ----
  topics_dim.parquet:
    grain: "one row per OpenAlex topic (4,516)"
    keys: [topic_id]
    columns:
      - {name: domain_id, dtype: int32, meaning: null}
      - {name: domain_name, dtype: category, meaning: null}
      - {name: field_id, dtype: int32, meaning: null}
      - {name: field_name, dtype: category, meaning: null}
      - {name: subfield_id, dtype: int32, meaning: null}
      - {name: subfield_name, dtype: category, meaning: null}
      - {name: topic_id, dtype: category, meaning: "primary key"}
      - {name: topic_name, dtype: category, meaning: null}
      - {name: keywords, dtype: category, meaning: null}
      - {name: expansion_by_period, dtype: object, meaning: "list<double>; ACCORD per-period Expansion score series"}
      - {name: acceleration_by_period, dtype: object, meaning: "list<double>; ACCORD per-period Acceleration score series"}
      - {name: frontier_score_by_period, dtype: object, meaning: "list<double>; ACCORD per-period composite frontier score series"}
      - {name: expansion_latest, dtype: float32, meaning: "most recent period's Expansion score"}
      - {name: acceleration_latest, dtype: float32, meaning: "most recent period's Acceleration score"}
      - {name: frontier_score_latest, dtype: float32, meaning: "most recent period's composite frontier score; null for topics with is_frontier_scored=false"}
      - {name: quadrant, dtype: category, meaning: "{accelerating_expansion, accelerating_contraction, decelerating_expansion, decelerating_contraction}; null when not frontier-scored"}
      - {name: top25pct_frontier, dtype: boolean, meaning: "true iff frontier_score_latest is in the global top 25%; NULLABLE (pandas 'boolean', 810 nulls of 4,516) for topics without a frontier score -- 'unscored', not 'false'."}
      - {name: is_frontier_scored, dtype: bool, meaning: "non-nullable; false for the 811 excluded topics and for any other topic lacking a score for another reason -- both categories feed the app's own frontier-coverage caption, computed live from this column, not from a separate shipped index-level share"}
      - {name: exclusion_reason_label, dtype: category, meaning: "human-readable label for the topic's exclusion reason (its single-letter code, T/K/V/E/X/B/H/M/P/Y, dropped v1.7 -- no page ever read the code itself, only this label); non-null iff is_excluded=true"}
      - {name: is_excluded, dtype: bool, meaning: "the 811 catch-all exclusion list (DESIGN.md 811 references); COMPUTED count, never a typed constant in app code (L10) -- read as topics_dim.is_excluded.sum"}
      - {name: original_subfield_id, dtype: int16, meaning: "subfield assignment under the ORIGINAL taxonomy tree"}
      - {name: conservative_subfield_id, dtype: int16, meaning: "subfield assignment under the CONSERVATIVE tree"}
      - {name: bestfit_subfield_id, dtype: int16, meaning: "subfield assignment under the BESTFIT tree (shipped default)"}
      - {name: fit_quality, dtype: category, meaning: "{no_fit, forced, fits}"}
    dropped_columns: "v1.7: exclusion_reason_code, exclusion_list_version, review_status, change_level, repair_status -- single-letter-code, single-value-shipped, or free-text adjudication-trail columns no page in this app ever reads (a contract test covered exclusion_reason_code's own excluded/non-excluded coverage rule without the app itself selecting it by name -- that test now reads exclusion_reason_label's own non-null-iff-excluded rule instead, the same coverage property one level up)."

  # ---- erc.parquet ----
  erc.parquet:
    grain: "institution x ERC panel (28 panels present, panel_idx 0..27); 211,596 rows (not all 7,557 x 28 -- sparse to nonzero-mass cells)"
    keys: [institution_id, panel_idx]
    columns:
      - {name: inst_key, dtype: int32, meaning: null}
      - {name: institution_id, dtype: category, meaning: null}
      - {name: panel_idx, dtype: int16, meaning: "0-based ERC panel index, 28 panels (SIRIS-Lab/erc-classifiers id2label); erc_tau=0.5 global threshold (config.yaml)"}
      - {name: share, dtype: float32, meaning: "mass / index.erc_classified_mass_frac for this institution. Verified: mass/share is a per-institution constant across all its panel rows and equals index.erc_classified_mass_frac exactly (e.g. 784.2579731515212). SINGLE-LABEL-DOMINANT: a work's ERC mass is fractional 1/n_panels across the panels it clears tau in (DESIGN.md S5), so Sigma(share) per institution is <= 1. VERIFIED: max Sigma(share) across all institutions = 1.0000001 (float32 rounding), min = 0.547."}
      - {name: mass, dtype: float32, meaning: "fractional work-mass classified into this ERC panel"}
      - {name: si, dtype: float32, meaning: "share / mean(share over institutions with nonzero mass in that panel). VERIFIED: 0 null values in the shipped 211,596 rows -- no floor observed on this column (contrast with subfields.si)."}
      - {name: mass_full, dtype: float32, meaning: "full-counted (weight_full) analogue of `mass` -- SAME classified-mass rules (panel-hit share, tau=0.5, 1/n_panels_hit split across hit panels), same population, computed via `weight_full` instead of `weight_frac` in the same underlying join. NOT a share (has no `mass` role reversal -- `share`/`si` stay fractional-basis only, no _full variant shipped for those two). Basis note: `mass`/`mass_full` are whole-run-window (2020-2025, SDG-mass-basis-parallel; ERC applies no year filter either, same as sdg.parquet.mass) -- NOT the core_ar_window collab_pairs.parquet uses. Verified: mass_full >= mass on all 211,596 rows (weight_full=1 per appearing institution is always >= weight_frac's 0-1 split for the identical work population, 0 exceptions)."}

  # ---- sdg.parquet ----
  sdg.parquet:
    grain: "institution x SDG (16 SDGs); DENSE -- 120,912 rows = 7,557 institutions x 16, every institution has a row for every SDG even when share=0"
    keys: [institution_id, sdg_idx]
    columns:
      - {name: inst_key, dtype: int32, meaning: null}
      - {name: institution_id, dtype: category, meaning: null}
      - {name: sdg_idx, dtype: int16, meaning: "0-based SDG index, 16 values (SDG 17 not covered, DESIGN.md S5)"}
      - {name: share, dtype: float32, meaning: "MULTI-LABEL: mass / (index.sdg_tagged_share * index.sdg_eligible_mass_frac) for this institution -- denominator is the institution's SDG-TAGGED fractional mass, WINDOW = 2020-2025 (SDG mass basis, six-year) (window_conventions.sdg_mass_window -- build_sdg_table applies no year filter to the corpus it is handed, confirmed by sdg_year.parquet's own Sigma-over-6-years invariant below; NOT the 2020-2024 (core window) that intl_share/company_share use), VERIFIED exact (a work may carry several SDGs via 'any-keyword-hit', DESIGN.md S5). Invariant is 0 <= share <= 1 PER ROW (verified: range [0.0, 1.0] over all 120,912 rows), NOT Sigma<=1 -- Sigma per institution was observed up to 3.522568941116333 (verified max)."}
      - {name: esi, dtype: float32, meaning: "SDG specialisation index = institution SDG-tagged share / the Europe-wide average SDG-tagged share for that SDG, i.e. esi = share / europe_avg_tagged where europe_avg_tagged = SUM_index(sdg.mass) / SUM_index(sdg_tagged_share * sdg_eligible_mass_frac) -- the SDG-tagged-mass basis. Note: a separate, classified-mass-basis average (SUM(sdg.mass) / SUM(index.sdg_classified_mass_frac)) is a DIFFERENT statistic and understates the true divisor by a constant factor (about 4.2x) if used in esi's place -- do not substitute it. The shipped esi column is on the tagged-mass basis throughout. esi/share is a constant, deterministic rescaling within each sdg_idx -- esi and share rank institutions identically within one SDG."}
      - {name: mass, dtype: float32, meaning: "fractional work-mass tagged with this SDG, WINDOW = 2020-2025 (SDG mass basis, six-year) (window_conventions.sdg_mass_window; a work's mass is NOT divided across its SDG tags -- it counts in full toward every SDG it is tagged with, which is why Sigma(mass) over an institution's 16 rows can exceed its tagged mass)"}

  # ---- sdg_year.parquet ----
  sdg_year.parquet:
    grain: "institution x sdg x year (2020-2025, the FULL run window incl. the 2025 bonus year) -- UNCHANGED grain/window from v1 (only the field cross had the double-counting bug this phase fixes; dynamics/volume-by-year never summed across the hidden sdg_idx dimension the way the field groupby did, so no regrain needed here); 427,687 rows, sparse to nonzero cells. Tree-independent (SDG tagging has no tree dependency at all -- a work's SDG tags never change with the taxonomy tree, unlike a field bucket)."
    keys: [institution_id, sdg_idx, year]
    columns:
      - {name: inst_key, dtype: int32, meaning: "join key to index.inst_key"}
      - {name: institution_id, dtype: category, meaning: null}
      - {name: sdg_idx, dtype: int16, meaning: "0-based SDG index, 16 values -- same convention as sdg.parquet.sdg_idx"}
      - {name: year, dtype: int16, meaning: "publication year, 2020-2025. 2025 is the labelled BONUS year (config.yaml bonus_year, same convention as topics_all.vol_full_2025/doctype_by_year) -- trends/volume only, no impact-indicator meaning here (SDG tagging carries no impact-window restriction to begin with)."}
      - {name: mass_frac, dtype: float32, meaning: "renamed from an earlier `mass` name -- any consumer reading the old column name breaks. Same fractional work-mass, same tagging rule as sdg.parquet.mass; summed over all its years this table's mass basis is WINDOW = 2020-2025 (SDG mass basis, six-year) (window_conventions.sdg_mass_window). Verified: Sigma_year over all 6 years == sdg.parquet.mass for the same (institution_id, sdg_idx), max relative difference 1.192e-07."}
      - {name: mass_full, dtype: float32, meaning: "full-counted (weight_full) analogue of mass_frac, same tagging rule/grain/window. Verified: mass_full >= mass_frac on all 427,687 rows (weight_full>=weight_frac by construction, 0 exceptions)."}
    build_note: "Same SDG keyword-hit tagging rule as sdg.parquet, grouped by publication year instead of field; carries both the fractional and full-counted mass basis."

  # ---- impact_fields.parquet ----

  # ---- doctype_by_year.parquet ----
  doctype_by_year.parquet:
    grain: "institution x year x document type, sparse to nonzero cells (institution population x 6 years {2020..2025} x up to 5 doc types; 141,182 rows, 1.0 MB, Verified). 2025 is the labelled BONUS year (config.yaml bonus_year, same convention as topics_all.vol_full_2025/vol_frac_2025): trends/volume only, excluded from impact indicators (composition skew)."
    keys: [institution_id, year, doc_type]
    columns:
      - {name: inst_key, dtype: int32, meaning: "join key to index.inst_key (L14 population order)"}
      - {name: institution_id, dtype: category, meaning: "OpenAlex institution id; restricted to the 7,557 index institutions (app/data/index.parquet)"}
      - {name: year, dtype: int16, meaning: "publication year, 2020-2025"}
      - {name: doc_type, dtype: category, meaning: "OpenAlex's own document type -- the harvest's own server-side type filter restricts this to {article, review, book, book-chapter, letter}; verified exactly these 5 values are observed across all 6 years, 0 other values."}
      - {name: vol_full, dtype: int32, meaning: "full (unfractionalized, head-count) work count in this institution x year x doc_type cell. Denominator note: SUM(vol_full) over doc_type for a given (institution, year) equals index.vol_full_by_year_this_run's packed value for that year exactly, verified on all 7,557 x 6 = 45,342 institution x year cells."}
      - {name: vol_frac, dtype: float32, meaning: "fractional-counted work count in this cell. Denominator note: SUM(vol_frac) over doc_type for a given (institution, year) equals index.vol_frac_by_year_this_run's packed value for that year within 1e-6 relative (1e-3 absolute for near-zero cells) -- verified on all 45,342 cells."}
    build_note: "Same corpus and attribution logic as index.parquet's own vol_full_by_year_this_run/vol_frac_by_year_this_run, with one extra grouping key (document type) -- not a new opinion about what counts, just a finer breakdown of the same totals."

  # ---- overrides/umbrella_supplement.csv ----
  overrides/umbrella_supplement.csv:
    grain: "one row per named umbrella/aggregate institution resolved by badge_calibration.md's known-umbrella search; 24 rows"
    keys: [institution_id]
    columns:
      - {name: display_name, dtype: object, meaning: "well-known short/official name; NOT always identical to index.display_name (ASCII-transliterated -- accents stripped -- since this file is shipped ASCII-safe, not UTF-8)."}
      - {name: institution_id, dtype: object, meaning: "OpenAlex institution id; all 24 resolved (0 blank -- badge_calibration.json's known_umbrellas_found covers all 24, only Helmholtz Association, the 25th named umbrella, has no institution row and is omitted entirely, not shipped with a blank id)"}
      - {name: note, dtype: object, meaning: "empty for 18 rows; carries 'structurally unflaggable -- output attributed to child institutions' for the 3 structurally unflaggable names (Fraunhofer Society, Portuguese FCT, UKRI); carries a type-outside-automatic-gate note for AP-HP/Romanian Academy/Hungarian Research Network (their patched `type` is outside {government,funder,facility,nonprofit}, so only this supplement flags them); carries a 'debatable' caveat for Institut Pasteur."}

  # ---- collab_pairs.parquet ----
  collab_pairs.parquet:
    grain: "one row per unordered pair (a,b), a<b by institution_id string, BOTH indexed institutions with >=1 co-published work anywhere 2020-2025 -- UNCHANGED from v1, NO FLOOR, NO ROW CHANGE (3,581,332 rows, 57.9 MB, zstd; the extra width is the 13 new CORE-AR columns, not new rows). Universe = `openalex_eu27_aug` UNION `openalex_supplement` per year, eu27_aug canonical on id overlap, same rule as v1."
    keys: [a, b]
    columns:
      - {name: a, dtype: category, meaning: "institution_id, the lexicographically SMALLER of the pair's two ids (string compare, not ROR/numeric)"}
      - {name: b, dtype: category, meaning: "institution_id, the lexicographically LARGER of the pair's two ids"}
      - {name: copubs_2020, dtype: int32, meaning: "UNCHANGED from v1: co-published works in 2020, ALL DOC TYPES, full counting (a work with N indexed co-authoring institutions contributes 1 to EVERY pair among them, not fractionally split). Feeds ONLY the Collaborate pulse (relationship year-by-year) chart, which stays all-types/2020-2025 by design (§2.1) -- every other Collaborate TABLE number reads the CORE-AR columns below instead."}
      - {name: copubs_2021, dtype: int32, meaning: null}
      - {name: copubs_2022, dtype: int32, meaning: null}
      - {name: copubs_2023, dtype: int32, meaning: null}
      - {name: copubs_2024, dtype: int32, meaning: null}
      - {name: copubs_2025, dtype: int32, meaning: "2025 bonus year (config.yaml bonus_year) -- included in copubs_total, not excluded the way impact indicators exclude it"}
      - {name: copubs_total, dtype: int32, meaning: "UNCHANGED from v1, KEPT (lib/collab_data.py's pulse reads this column by name; §2.2's prose only listed copubs_2020..2025 but never asked for its removal): SUM(copubs_2020..copubs_2025), all doc types. NOT the CORE-AR basis -- see core_total."}
      - {name: core_total, dtype: int32, meaning: "joint works on window_conventions.core_ar_window (articles+reviews, 2020-2024, full counting) -- c1+c2 exactly. THE denominator basis for every Collaborate TABLE number (replaces copubs_total for anything but the pulse chart). Cross-checked with an independent from-scratch recompute, byte-for-byte on all 3,153,049 CORE-AR pairs (0 mismatches). A strict subset of the copubs_total-basis qualifying set: the CORE-AR floor-5 set is 913,513 pairs, all a subset of the wider all-types floor-5 set."}
      - {name: c1, dtype: int32, meaning: "NEW: core_total's WINDOW = 2020-2022 (dynamics window 1, mean annual) slice (window_conventions.core_ar_window x dynamics_window_1) -- momentum's numerator-1/denominator-1 raw count."}
      - {name: c2, dtype: int32, meaning: "NEW: core_total's WINDOW = 2023-2024 (dynamics window 2, mean annual) slice -- momentum's numerator-2/denominator-2 raw count."}
      - {name: n_top10, dtype: int32, meaning: "NEW: PAIR-GRAIN rollup (Sigma over the pair's UNCAPPED CORE-AR topic rows, NOT the shipped top-100-capped the retired pair-topic table -- avoids the exact 'gaps on capped topics' undercount pattern named for a different table at review task 5.7) of works with cited_by_count >= the world subfield x year x type top-10% threshold T, among n_covered. Same >=, not >, convention as agg/impact.py::join_thresholds."}
      - {name: n_covered, dtype: int32, meaning: "NEW: PAIR-GRAIN rollup of CORE-AR joint works landing in a (bestfit_subfield_id, year, type) cell that HAS a world threshold T (world_thresholds.parquet is null on ~24% of cells) AND is not retracted. ALWAYS divide n_top10 by n_covered, never by core_total (mixes windows/undercounts, same review #7 rule the retired pair-topic table's n_covered column already documents). Undercounts core_total by the same ~0.07% of works with no primary topic that every topic-grain rollup here excludes (topics_dim has no 'no primary topic' bucket) -- disclosed, not silently absorbed."}
      - {name: n_sdg, dtype: int32, meaning: "PAIR-GRAIN rollup of CORE-AR joint works with >=1 SDG keyword hit (any-hit tagging rule, the same lightweight tagging source every SDG-tagged-count column in this file uses). Same ~0.07% topicless-work undercount as n_covered/n_top10 above."}
      - {name: fwci_median, dtype: float32, meaning: "MEDIAN FWCI over the pair's CORE-AR joint works with a valid FWCI value (subfield mapped -- ~99.93% of CORE-AR works), NULL when < 3 such works ('nullable when < 3 covered works', read as 'covered by a valid FWCI value', not the PP-threshold n_covered above -- a DIFFERENT 'covered' concept, disclosed here to head off confusion between the two). FWCI(work) = cited_by_count / mean_cited(subfield x year x type stratum), reference = fwci_ref.parquet (an internal working table, NOT deployed -- see the note at the bottom of this file), European reference corpus (this harvest), NOT world. 913,506 / 913,513 CORE-AR floor-5 qualifying pairs have a non-null value (the 7-pair gap: pairs whose few joint works all fall on the topicless/unmapped-subfield edge case)."}
      - {name: rank_in_a, dtype: Int32, meaning: "RECOMPUTED on core_total (was copubs_total in an earlier build): dense rank (1=highest) of `b` among ALL of `a`'s CORE-AR partners, computed BEFORE any floor. NULLABLE (Int32, was non-nullable int32 in v1): a pair present in this table only because it has a copubs_total>=1 (v1's grain) but core_total==0 (no CORE-AR joint work at all) never enters the ranking population -- null, not a fabricated worst-rank tie."}
      - {name: rank_in_b, dtype: Int32, meaning: "same rule, `b`'s own perspective, RECOMPUTED on core_total"}
      - {name: mom_class, dtype: category, meaning: "{up, down, stable, ns, new, dormant, weak} -- momentum classification, in priority order: new = c1==0 & c2>=5; dormant = c2==0 & c1>=5; weak = 0<c1<5 (thin window-1 base, ratio not trusted, no % shown); ns = every other c1==0 case (insufficient signal either window) OR an up/down candidate demoted by a pooled two-proportion z-test (p>=0.05, alpha in collab_facts.json); up = rr>=1.25; down = rr<=0.80; stable = the remaining c1>=5 & c2>=1 rows. Pairs with core_total==0 (present only because copubs_total>=1) are filled 'ns' (no CORE-AR signal at all). Colours/glyphs are never a fill alone, always paired with a glyph/text (up-arrow/down-arrow/right-arrow)."}
      - {name: mom_rr, dtype: float32, meaning: "NEW: recentred ratio rr = r/MED where r = (c2/d2)/(c1/d1) (d1/d2 = index.total_ar_full_w1/w2[a]+[b]), MED = median(r) over the ELIGIBLE population (c1>0, c2>0, c1+c2>=10, collab_facts.json elig_min) -- MED=1.0431 this run (VERIFIED in [0.8,1.3], the momentum-sanity HALT band, §3 invariant). NULL whenever c1==0 or d1==0 or d2==0 (r undefined) -- includes new/dormant/most-ns rows by construction, but IS populated for 'weak' rows when computable (a real value, just not display-trusted per the weak-base rule)."}
      - {name: mom_p, dtype: float32, meaning: "NEW: two-sided p-value of the pooled two-proportion z-test on (c1/d1) vs (c2/d2), computed ONLY for rows that were an up/down CANDIDATE before the z-test demotion (rr past the +-25% band) -- NULL for every other row (new/dormant/weak/ns/stable never get a p-value at all, not just an insignificant one). p>=alpha (0.05) demotes the row's mom_class to 'ns' but mom_p itself is never overwritten -- the demoted row's own p-value stays readable as the reason for the demotion."}
      - {name: erc_top_panel, dtype: category, meaning: "moved here from an earlier topic-grain table to its natural pair grain; still descriptive-header-only, basis unchanged and disclosed: the ERC panel_idx (app/lib/engine/resources/erc_panels.csv) most frequently the work-level argmax(probs) among ALL the pair's joint works on the OLD, ALL-TYPES/2020-2025 basis (NOT recomputed on CORE-AR)."}
      - {name: erc_top_panel_n, dtype: int32, meaning: "CARRIED FORWARD UNCHANGED, same old (all-types/2020-2025) basis: count of the pair's labelled joint works landing on erc_top_panel."}
      - {name: erc_labelled_n, dtype: int32, meaning: "CARRIED FORWARD UNCHANGED, same old basis: labelled-denominator (works with an erc_probs row at all) -- erc_top_panel_n/erc_labelled_n is 'of the labelled works', never divide by copubs_total or core_total."}
    build_note: "Built in one pass per year: pair counts and institution CORE-AR totals, then topic/field assignment and the FWCI join restricted to the core_total>=5 qualifying set, then the final assembly of this table, collab_facts.json and index.parquet's total_ar_full_w1/w2 together. The legacy columns (a, b, copubs_*) are unchanged; only rank_in_a/rank_in_b are recomputed on the CORE-AR basis."

  # ---- collab_pair_fields.parquet ----
  collab_pair_fields.parquet:
    grain: "This table's current schema -- BREAKING rebasis + rename, supersedes the earlier build. One row per (a, b, field_id) for pairs with core_total >= 5 (same CORE-AR floor and qualifying-pair set as the retired pair-topic table), UNCAPPED (every field the pair has any joint CORE-AR mass in). 3,571,800 rows, 26.6 MB, zstd. Same eu27_aug+supplement UNION universe, filtered to type in {article,review}, 2020-2024 (window_conventions.core_ar_window) before any row enters this table."
    keys: [a, b, field_id]
    columns:
      - {name: a, dtype: category, meaning: "institution_id, smaller of the pair (same a<b convention as collab_pairs)"}
      - {name: b, dtype: category, meaning: "institution_id, larger of the pair"}
      - {name: field_id, dtype: int16, meaning: "OpenAlex field id (topics_dim.field_id), reached via each joint work's PRIMARY topic -> BESTFIT subfield -> field (tree-independent nesting, unchanged from v1)"}
      - {name: vol, dtype: int16, meaning: "RENAMED from v1's vol_total (BREAKING, same disposition as the retired pair-topic table's vol column -- CD4's JOINT_ROLLUP_VALUE_COLS/FIELD_BREAKDOWN_COLS constants hard-code the old name, flagged): joint CORE-AR works with primary topic in this field = vol_w1+vol_w2, NO vol_2025 term (dropped, CORE-AR has none)."}
      - {name: vol_w1, dtype: int16, meaning: "joint CORE-AR works with primary topic in this field, WINDOW = 2020-2022 (dynamics window 1, mean annual)"}
      - {name: vol_w2, dtype: int16, meaning: "joint CORE-AR works with primary topic in this field, WINDOW = 2023-2024 (dynamics window 2, mean annual)"}
      - {name: n_top10, dtype: int16, meaning: "same convention as the retired pair-topic table's n_top10 column, rolled up to field grain, now on the CORE-AR population natively (no basis mismatch with vol above -- the exact review task 6 row-9 fix)."}
      - {name: n_covered, dtype: int16, meaning: "same convention as the retired pair-topic table's n_covered column, rolled up to field grain. VERIFIED: n_top10 <= n_covered <= vol on all 3,571,800 shipped rows, 0 violations (invariants_p7.py)."}
      - {name: n_sdg, dtype: int16, meaning: "field-grain rollup of joint CORE-AR works with >=1 SDG keyword hit, same tagging source as collab_pairs.n_sdg / the retired pair-topic table's n_sdg column."}
      - {name: fwci_median, dtype: float32, meaning: "MEDIAN FWCI over this row's CORE-AR joint works with a valid FWCI value, NULL when < 3 such works."}
      - {name: mom_class, dtype: category, meaning: "same rule as the retired pair-topic table's mom_class column, computed from this row's vol_w1/vol_w2 against the parent pair's d1/d2/MED."}
      - {name: fwci_mean, dtype: float32, meaning: "ADDED (v1.7): mean FWCI over this row's CORE-AR joint works with a valid FWCI value; NaN iff n_fwci==0. Unfloored (contrast with fwci_median's n<3 floor), so fwci_mean is defined on strictly more rows than fwci_median."}
      - {name: n_fwci, dtype: int32, meaning: "ADDED (v1.7): count of this row's CORE-AR joint works with a valid FWCI value -- the fwci_mean denominator, unfloored. n_fwci >= n_covered on every shipped row: n_fwci counts every FWCI-covered joint work (FWCI's own fallback rule reaches a work whose exact subfield x year x type stratum has no world PP10 threshold), while n_covered counts only the narrower, non-fallback, retraction-excluded set of joint works eligible for the world top-decile flag above."}
    dropped_column: "mean_citations (v1's uncapped-table impact proxy, the ONE table that could still afford it after the retired pair-topic table dropped it for size) is SUPERSEDED by fwci_median and dropped."
    build_note: "Field-level accumulation runs in the same per-work pass as the retired pair-topic table's topic-level one, restricted to the same core_total>=5 qualifying pairs."

  # ---- collab_pair_subfields.parquet ----
  collab_pair_subfields.parquet:
    grain: "One row per (a, b, bestfit subfield_id), same core_total>=5 qualifying-pair set as collab_pair_fields.parquet (913,513 pairs), CAPPED to each pair's top 30 subfields by joint volume (ties broken by subfield_id ascending) -- unlike collab_pair_fields.parquet, which is uncapped. 7,995,178 rows, ~48.9 MB, zstd (max compression level; fwci_mean/fwci_median stored rounded to three decimals, which alone took this file from ~64 MB to ~49 MB -- float noise beyond the 3rd decimal was dominating the compressed stream). Same eu27_aug+supplement UNION universe, filtered to type in {article,review}, 2020-2024 (window_conventions.core_ar_window) before any row enters this table."
    keys: [a, b, subfield_id]
    columns:
      - {name: a, dtype: category, meaning: "institution_id, smaller of the pair (same a<b convention as collab_pairs)"}
      - {name: b, dtype: category, meaning: "institution_id, larger of the pair"}
      - {name: subfield_id, dtype: int16, meaning: "OpenAlex subfield id (topics_dim.bestfit_subfield_id), reached via each joint work's PRIMARY topic -> BESTFIT subfield (one step coarser than topic, one step finer than collab_pair_fields.field_id)"}
      - {name: vol, dtype: int32, meaning: "joint CORE-AR works with primary topic in this subfield = vol_w1+vol_w2. Wider dtype than collab_pair_fields.vol (int32 not int16): a few cells on the largest pairs exceed int16 range at this finer grain, same reasoning as collab_topic_vols.parquet's own vol column."}
      - {name: vol_w1, dtype: int32, meaning: "joint CORE-AR works with primary topic in this subfield, WINDOW = 2020-2022 (dynamics window 1)"}
      - {name: vol_w2, dtype: int32, meaning: "joint CORE-AR works with primary topic in this subfield, WINDOW = 2023-2024 (dynamics window 2)"}
      - {name: n_covered, dtype: int32, meaning: "same convention as collab_pair_fields.n_covered, rolled up to subfield grain. VERIFIED: n_top10 <= n_covered <= vol on every shipped row."}
      - {name: n_top10, dtype: int32, meaning: "same convention as collab_pair_fields.n_top10, rolled up to subfield grain."}
      - {name: fwci_mean, dtype: float32, meaning: "mean FWCI over this row's CORE-AR joint works with a valid FWCI value, stored to three decimals; NaN iff n_fwci==0. Same unfloored convention as collab_pair_fields.fwci_mean (which is NOT rounded -- this table's rounding is a size-only difference between the two tables, not a precision-policy one)."}
      - {name: fwci_median, dtype: float32, meaning: "median FWCI over the same population as fwci_mean, stored to three decimals; NULL when n_fwci < 3 (same floor as collab_pair_fields.fwci_median, which is NOT rounded)."}
      - {name: n_fwci, dtype: int32, meaning: "count of this row's CORE-AR joint works with a valid FWCI value -- the fwci_mean denominator, unfloored."}
    build_note: "Same per-year source tables as collab_pair_fields.parquet (one row per joint CORE-AR work), rolled up one grain finer via topics_dim.bestfit_subfield_id instead of field_id, then capped to each pair's top 30 subfields by vol. A pair with <=30 distinct subfields is therefore identical, field-by-field, to a same-pair rollup of collab_pair_fields.parquet (verified); a pair with more than 30 loses its smallest-volume subfields, by design -- this table trades completeness for a bounded row count per pair, the way collab_pair_fields.parquet does not need to."

  # ---- collab_topic_vols.parquet ----
  collab_topic_vols.parquet:
    grain: "one row per (a, b, topic_id) for the SAME core_total>=5 qualifying-pair set as the retired pair-topic table, but UNCAPPED (every topic the pair has ANY joint CORE-AR mass in, not just its top-100) -- built for exactly one consumer: lib/collab_data.py's untapped gaps table, which previously read the top-100-capped the retired pair-topic table and silently read a false 0 (joint_observed) for any shared topic outside a pair's top-100, inflating gap = joint_expected - joint_observed. 15,392,404 rows, 36.6 MB, zstd -- sized against the OLD all-types/2020-2025 basis at 19,234,095 rows/45.57 MB, predicting the CORE-AR basis would be smaller (strict subset); CONFIRMED (the basis-delta prediction verified live)."
    keys: [a, b, topic_id]
    columns:
      - {name: a, dtype: category, meaning: "institution_id, smaller of the pair"}
      - {name: b, dtype: category, meaning: "institution_id, larger of the pair"}
      - {name: topic_id, dtype: category, meaning: "OpenAlex topic id; PRIMARY topic of the joint work only, same rule as the retired pair-topic table"}
      - {name: vol, dtype: int32, meaning: "joint CORE-AR works with this primary topic = vol_w1+vol_w2, UNCAPPED (CORE-AR for consistency with every other Collaborate number -- NOT all-types). Wider dtype than the retired pair-topic table's vol column (int32 not int16) since a few uncapped cells exceed int16 range on the largest pairs."}
    build_note: "Written from the same uncapped intermediate the retired pair-topic table's top-100 truncation is drawn from, so the two tables never diverge from a separate aggregation pass. The pair set is exactly collab_pairs.parquet's core_total>=5 rows (a scripted invariant)."

  # ---- fwci_taxa.parquet ----
  fwci_taxa.parquet:
    grain: "institution x grain x taxon_id, sparse to n_covered>=3 cells; 703,571 rows, 6.85 MB zstd (field 104,714 / subfield 384,212 / sdg 75,046 / erc 139,599)."
    keys: [institution_id, grain, taxon_id]
    columns:
      - {name: institution_id, dtype: category, meaning: null}
      - {name: grain, dtype: category, meaning: "{field, subfield, sdg, erc} -- four categories, fixed order. field/subfield are BESTFIT-TREE ONLY (subfield_id is always derived from topics_dim.bestfit_subfield_id, never original/conservative): FWCI at these two grains does NOT vary with Compare's tree toggle, and the UI caption/basis chip must disclose this. sdg taxon_id is the SAME 0-based sdg_idx sdg.parquet/sdg_year.parquet already use (code 'SDG03' -> index 2, SDG17 not covered). erc taxon_id is the SAME 0-based panel_idx erc.parquet already uses (28 panels, erc_tau=0.5 global threshold, config.yaml) -- ERC-grain n_covered has a real, permanent ~7.3% coverage ceiling below field/subfield/sdg (only 92.7% of CORE-AR works have a matching ERC-classification row), on top of the n_covered<3 floor."}
      - {name: taxon_id, dtype: int32, meaning: "OpenAlex field_id / subfield_id (grain=field/subfield), 0-based sdg_idx (grain=sdg), or 0-based panel_idx (grain=erc) -- interpret ONLY together with `grain`, the same taxon_id integer range is reused across grains (e.g. field_id and sdg_idx both start near 0-30)."}
      - {name: fwci_median, dtype: float32, meaning: "MEDIAN FWCI over this institution's CORE-AR works (articles+reviews, 2020-2024, FULL/binary attribution -- window_conventions.core_ar_window: a work counts ONCE per institution present regardless of collaboration weight) covered by this taxon, floored at n_covered>=3. THE BAR VALUE (bar=median, hover=mean+n_covered). Compare against fwci_taxa_ref.eu_median_work_fwci for the SAME (grain, taxon_id) -- the two are the SAME statistic (median) over the SAME unit (works), one institution-scoped, one corpus-wide."}
      - {name: fwci_mean, dtype: float32, meaning: "MEAN FWCI over the SAME population as fwci_median -- hover-only, never the bar. NOT pinned near 1.0 at institution grain the way a full-stratum corpus mean is -- an institution's own covered-works mean can sit well above or below 1 depending on which subset of the corpus it publishes into. Computed via an explicit float64 upcast before the groupby mean, to avoid float32 summation-order noise."}
      - {name: n_covered, dtype: int32, meaning: "count of this institution's CORE-AR works (SAME population as fwci_median/fwci_mean) that have a valid FWCI AND fall in this taxon -- the hover denominator and the hatch-trigger column for FWCI charts (RATIO_HATCH_FLOOR=50 on THIS column, amended so FWCI behaves like PP's n_works_full, genuinely per-row, not like Share's institution-constant denom_value). Floored at >=3 by construction (every shipped row has n_covered>=3); heavy hatching at floor 50 on subfield grain (measured ~83% population-wide) is ACCEPTED as honest disclosure, not a bug."}
    build_note: "Built per grain (field, subfield, SDG, ERC) then combined; each grain joins the per-work FWCI table to the institution attribution and, for SDG/ERC, the same tagging and thresholding rules those two tables use elsewhere. Independently cross-checked against a from-scratch recomputation for a spot institution, byte-identical."

  # ---- fwci_taxa_ref.parquet ----
  fwci_taxa_ref.parquet:
    grain: "grain x taxon_id, ALL taxa that appear at least once in the CORE-AR corpus (no floor -- contrast with fwci_taxa.parquet's n_covered>=3); 317 rows (field 26, subfield 247, sdg 16, erc 28), 0.005 MB zstd. Dense within each grain's known taxon range (every field/subfield/sdg/erc taxon that exists in this snapshot has a row here)."
    keys: [grain, taxon_id]
    columns:
      - {name: grain, dtype: category, meaning: "{field, subfield, sdg, erc} -- SAME categories/taxon_id convention as fwci_taxa.parquet.grain (read that column's meaning first)."}
      - {name: taxon_id, dtype: int32, meaning: "SAME convention as fwci_taxa.parquet.taxon_id -- interpret only together with `grain`."}
      - {name: eu_median_work_fwci, dtype: float32, meaning: "the chart reference: the MEDIAN FWCI over ALL CORE-AR works (articles+reviews, 2020-2024, window_conventions.core_ar_window) mapped to this (grain, taxon_id), across the WHOLE European reference corpus (the local EU27+GB/CH/NO/IS harvest union -- NEVER world OpenAlex) -- NOT institution-filtered. Drawn as a per-row varying dashed reference line; hover/caption copy must read 'European median work in this [grain]', never 'average' (the corpus MEAN is pinned to ~1.000 by construction and would misrepresent the skewed distribution as neutral). CAN BE EXACTLY 0.0 on a well-populated taxon: field_id=12 'Arts and Humanities' has eu_median_work_fwci=0.0 on 270,268 works because 62.9% of them have zero citations -- a genuine, well-known humanities citation-practice fact, not a defect. 27 (grain, taxon_id) rows total have eu_median_work_fwci==0.0 on a well-populated taxon (>=50 works observed at build time, before v1.7 dropped the row-count column itself)."}
    dropped_columns: "v1.7: n_works (the corpus-wide work count eu_median_work_fwci was computed over) -- no page reads this corpus-wide denominator; the app's own per-institution n_covered (fwci_taxa.parquet) is the denominator every rendered hover actually uses."
    build_note: "Built from the same joins as fwci_taxa.parquet, minus the institution-attribution split (this table is corpus-wide, not per-institution). Invariant-checked alongside fwci_taxa.parquet."

  # ---- inst_topic_impact.parquet ----
  inst_topic_impact.parquet:
    grain: "institution x PRIMARY topic (the work's own first pipe-delimited topic, the same convention topic_leaders.parquet/topics_led.parquet/star_works.parquet use), articles and reviews only, 2020-2024 (window_conventions.core_ar_window), full attribution (a work counts once per institution present); floored at n_ar>=3. 988,587 rows, 11.63 MB zstd."
    keys: [institution_id, topic_id]
    columns:
      - {name: institution_id, dtype: category, meaning: null}
      - {name: topic_id, dtype: category, meaning: "the work's PRIMARY topic"}
      - {name: n_ar, dtype: int32, meaning: "count of this institution's CORE-AR works with this primary topic. Bounded above by topics_all.parquet's own whole-run volume for the matching (institution, topic, 2020-2024) slice, to within a small, disclosed epsilon: 0.0116% of rows exceed that bound, always by exactly one work, always on a topic where topics_all.parquet's own snapshot has since moved a boundary work to 2025 -- an ordinary cross-snapshot vintage disagreement, not a data-quality defect."}
      - {name: n_covered, dtype: int32, meaning: "of n_ar, the count with a valid FWCI value -- the fwci_mean/fwci_median denominator. 0 is a valid value (no shipped row happens to reach it, since every shipped row already clears the n_ar>=3 floor with margin); fwci_mean/fwci_median are NaN exactly iff n_covered==0."}
      - {name: fwci_mean, dtype: float32, meaning: "mean FWCI over this institution's n_covered works on this topic; NaN iff n_covered==0."}
      - {name: fwci_median, dtype: float32, meaning: "median FWCI over the same n_covered population; NaN iff n_covered==0."}
      - {name: n_pp, dtype: int32, meaning: "of n_ar, the count with a world top-decile threshold available for their own (original-tree subfield, year, type) cohort -- the pp10_wd denominator."}
      - {name: n_top10_wd, dtype: int32, meaning: "of n_pp, the count landing at or above that world threshold. pp10_wd = n_top10_wd / n_pp, computed at query time, not itself a shipped column."}
    build_note: "The same institution attribution and world-threshold join impact_taxa.parquet uses, at topic grain instead of field/subfield/SDG/ERC grain, restricted to each work's PRIMARY topic. Cross-checked against impact_taxa.parquet: n_pp and pp10_wd reconcile exactly (638/638 anchor cells) when rolled up to the shared bestfit-subfield grain. Cross-checked against fwci_taxa.parquet: n_covered reconciles on 99.47% of anchor cells, the residual (three cells, each off by one or two works) traced to re-deriving institution attribution from the raw corpus a second time rather than reading a single frozen attribution table -- a small, bounded epsilon, not a logic error."

  # ---- impact_taxa.parquet ----
  impact_taxa.parquet:
    grain: "institution x grain x taxon_id, floored at n_covered_pp>=1 (NO display floor lives in the data -- the below-floor CAUTION channel is a UI-layer rendering rule over this same unfloored table, not a second, filtered file). 1,100,275 rows (field 141,654 / 26 distinct fields, subfield 687,618 / 247 distinct subfields, sdg 100,400 / 16 distinct goals, erc 170,603 / 28 distinct panels), 3.28 MB zstd."
    keys: [institution_id, grain, taxon_id]
    columns:
      - {name: institution_id, dtype: category, meaning: null}
      - {name: grain, dtype: category, meaning: "{field, subfield, sdg, erc} -- SAME four categories/fixed order as fwci_taxa.parquet.grain. field/subfield taxon_id is the BESTFIT-TREE subfield/field (topics_dim.bestfit_subfield_id -> field_id) -- SAME tree fwci_taxa.parquet uses at these two grains, so the two impact-matrix cells (FWCI_EU, PP10_WD) sit on the identical taxonomic grain and are directly crossable. This is a DELIBERATE CHOICE, not automatic: the per-work top-10% FLAG itself is always decided in the work's ORIGINAL-tree subfield x year x type cohort (world_thresholds.parquet's own basis) -- only the GRAIN ROLLUP (which field/subfield cell a flagged work's mass lands in) uses bestfit. sdg taxon_id is the SAME 0-based sdg_idx sdg.parquet/fwci_taxa.parquet already use (SDG17 not covered). erc taxon_id is the SAME 0-based panel_idx erc.parquet/fwci_taxa.parquet already uses (28 panels, erc_tau=0.5 global threshold)."}
      - {name: taxon_id, dtype: int32, meaning: "SAME convention as fwci_taxa.parquet.taxon_id at each grain -- interpret only together with `grain`."}
      - {name: pp10_wd, dtype: float32, meaning: "PP(top10% of WORLD): the fraction of this institution's CORE-AR works (articles+reviews, 2020-2024, window_conventions.core_ar_window), mapped to this (grain, taxon_id) AND covered by a world threshold (see n_covered_pp below), whose citation count is >= the world threshold T of the work's OWN ORIGINAL subfield x year x type cohort. FULL/BINARY attribution: a work counts ONCE per institution present, regardless of collaboration weight -- a deliberate, disclosed departure from the shipped impact_fields.parquet's pp_top10_frac (fractional weight_frac attribution); PP10_WD is a new metric name precisely because it is built to cross with FWCI_EU at any grain, not a rename of the existing fractional-basis PP. Cross-checked three ways: n_covered_pp (1699) equals the shipped impact_fields.parquet cell's n_works_full exactly for a spot institution x field (tree=bestfit, floor=30: same population/tree/flag), while pp10_wd (0.167746, full/binary) differs from the shipped pp_top10_frac (0.109063, fractional) by a disclosed, expected, attribution-basis-only gap (+0.058683) -- named, not a defect. Also reconciled against one live OpenAlex probe: a (subfield, year, type) cohort slice inside that same field cell reproduces both the cohort's total covered-work count and its >=threshold count exactly."}
      - {name: n_covered_pp, dtype: int32, meaning: "count of this institution's CORE-AR works, mapped to this (grain, taxon_id), that HAVE a world threshold for their own (ORIGINAL subfield, year, type) cohort -- the pp10_wd DENOMINATOR. A work with no world threshold (0.113% of CORE-AR works are uncovered: 6,389 of 5,652,387) is excluded from BOTH the pp10_wd numerator and this denominator, never silently folded into either. Floored at >=1 only -- NO 10/30 mass-floor gate lives in this table: the shipped impact_fields.parquet's 10/30-floor variants are a display convention on a DIFFERENT, fractional-mass-attribution table, and a floor stated in fractional-mass units does not translate 1:1 to this column's FULL/binary head-count -- the UI's below-floor caution channel reads this raw, unfloored column directly, per-row, rather than reusing impact_fields' own floor variants."}
    build_note: "Built per grain (field, subfield, SDG, ERC) from a per-work CORE-AR substrate, using the same institution attribution and tagging/thresholding joins as fwci_taxa.parquet, plus the shared world-threshold flag logic every top-10%-of-world figure in the app reuses. Cross-checked three ways: against the shipped impact_fields.parquet's own count on a spot cell, and against one live OpenAlex reconciliation."

  # ---- share_refs.parquet ----
  share_refs.parquet:
    grain: "grain x taxon_id x basis (frac|full), dense within each grain's known taxon range x both bases. 634 rows (field 52 = 26 x 2, subfield 494 = 247 x 2, sdg 32 = 16 x 2, erc 56 = 28 x 2), 0.01 MB zstd."
    keys: [grain, taxon_id, basis]
    columns:
      - {name: grain, dtype: category, meaning: "{field, subfield, sdg, erc} -- SAME taxon_id convention as impact_taxa.parquet/fwci_taxa.parquet at each grain (field/subfield: BESTFIT tree)."}
      - {name: taxon_id, dtype: int32, meaning: "SAME convention as impact_taxa.parquet.taxon_id at each grain."}
      - {name: basis, dtype: category, meaning: "{frac, full} -- the SAME full/frac toggle Compare's basis chip already applies. field/subfield: eu_mean_share genuinely differs by basis (computed independently off fields.parquet/subfields.parquet's own share_frac/share_full columns). sdg/erc: sdg.parquet/erc.parquet ship a SINGLE, non-basis-toggled `share` column (Compare's own Share tab does not basis-toggle these two grains' share value either, profile_data.py's sdg_table/erc_table) -- the IDENTICAL eu_mean_share value is shipped under BOTH basis rows here, disclosed rather than silently duplicated, so a consumer can always join on (grain, taxon_id, basis) without a grain-specific special case."}
      - {name: eu_mean_share, dtype: float32, meaning: "the UNWEIGHTED MEAN-OF-RATIOS European reference: average, across institutions with nonzero mass in this (grain, taxon_id), of each institution's OWN share -- the same statistic and population the app's own field/subfield specialisation-index reference uses elsewhere. field: mean(share_frac or share_full) over fields.parquet's own rows (no floor at this grain, matches fields.si's own no-floor population exactly). subfield: same over subfields.parquet's rows (unfloored -- matches the app's own unfloored specialisation-index population, NOT the G6-floored subfields.si column). sdg: uses this same mean-of-ratios statistic, filtered to sdg.parquet rows with mass>0 (the dense table's own zero-share rows excluded) -- deliberately NOT the shipped sdg.esi (a different ratio-of-sums statistic, 'Europe as one pooled institution' -- silently reusing esi here would mix two incompatible reference conventions under one 'European mean share' label). erc: mean(share) over erc.parquet's own rows (already sparse to nonzero-mass, no extra filter needed, matches erc.si's own no-floor population)."}
    build_note: "A pure population statistic computed directly over the already-shipped per-institution share columns (fields.parquet, subfields.parquet, erc.parquet, sdg.parquet), not a per-work rebuild."

  # ---- collab_pair_domain_year.parquet ----
  collab_pair_domain_year.parquet:
    grain: "one row per (a, b, domain_id, year) for pairs with core_total >= 5 (the same CORE-AR qualifying-pair floor as the other pair-grain collab tables), articles+reviews, 2020-2024 (window_conventions.core_ar_window). 6,084,150 rows, 12.35 MB, zstd. Feeds the Relationship block's yearly stacked-by-domain chart."
    keys: [a, b, domain_id, year]
    columns:
      - {name: a, dtype: category, meaning: "institution_id, smaller of the pair (same a<b convention as collab_pairs)"}
      - {name: b, dtype: category, meaning: "institution_id, larger of the pair"}
      - {name: domain_id, dtype: int8, meaning: "OpenAlex domain id (1 Life Sciences, 2 Social Sciences, 3 Physical Sciences, 4 Health Sciences), reached via each joint work's PRIMARY topic -> bestfit field -> domain (topics_dim.parquet, 1:1 map, every field maps to exactly one domain, asserted at build time)"}
      - {name: year, dtype: int16, meaning: "publication year, 2020-2024"}
      - {name: vol, dtype: int32, meaning: "joint CORE-AR works with a primary topic in this domain, this year, full counting. Sums to the pair's collab_pairs.core_total to within a disclosed, expected residual (~0.0099% of total volume across all qualifying pairs): a joint work with NO primary topic contributes to core_total (topic-blind) but not to any topic-grain rollup, including this one -- the same gap collab_pair_fields.parquet and the retired pair-topic table already carry."}
    build_note: "Rolled up from the same per-year pair x field data collab_pair_fields.parquet is built from, via topics_dim's field-to-domain map."

  # ---- topic_leaders.parquet ----
  topic_leaders.parquet:
    grain: "topic x rank, rank 1..n (n<=200, the OpenAlex group_by page cap) per topic_id, one ranking across every institution type (v1.7 retires the earlier two-pool split); 890,415 rows, 1.93 MB, zstd. Covers all 4,516 topics."
    keys: [topic_id, rank]
    columns:
      - {name: topic_id, dtype: category, meaning: "OpenAlex topic id (topics_dim.topic_id)"}
      - {name: rank, dtype: int16, meaning: "1-based rank by world publication count (articles+reviews, 2020-2024) within topic_id, dense, contiguous, no gaps, capped at 200"}
      - {name: institution_id, dtype: category, meaning: "OpenAlex institution id of the ranked publisher (NOT restricted to this app's 7,557-institution index -- world publishers include non-indexed institutions, e.g. large non-European research organisations)"}
      - {name: display_name, dtype: string, meaning: "OpenAlex display name; populated for rank<=10 only (null beyond, since only the top-10 names are ever shown in the app), and can be null even at rank<=10 on the rare topic where OpenAlex returned no name for that institution id (9 such rows shipped -- the app falls back to the institution id, or this app's own index display_name when the id happens to be an indexed institution)"}
    dropped_columns: "v1.7: n_works (the world publication count each rank was computed on) -- no page reads the raw count, only the rank itself; the ranking rule it fed is now stated directly on the `rank` column above."
    build_note: "A live OpenAlex sweep, one query per topic, grouped by publishing institution, every institution type ranked together (a body that runs many institutes under one name accumulates more publications than any single university -- the app's own Methods page states the resulting skew). Pulled on 2026-09-03 -- a different date from the OpenAlex harvest snapshot behind every other table; report both vintages in any Methods text, they are not interchangeable."

  # ---- topics_led.parquet ----
  topics_led.parquet:
    grain: "one row per (institution_id, topic_id) where an INDEXED institution (app/data/index.parquet's 7,557) holds rank<=20 in topic_leaders.parquet; 24,698 rows, 0.08 MB, zstd."
    keys: [institution_id, topic_id]
    columns:
      - {name: institution_id, dtype: category, meaning: "restricted to indexed institutions only (topic_leaders.parquet's own institution_id is unrestricted; this table is the indexed-population slice)"}
      - {name: topic_id, dtype: category, meaning: "OpenAlex topic id"}
      - {name: rank, dtype: int16, meaning: "1..20 (this table's own floor -- topic_leaders.parquet carries ranks up to 200, this table keeps only the top-20 cut the app's single 'topics led' figure uses)"}
    build_note: "A filter of topic_leaders.parquet down to indexed institutions at rank<=20, one ranking across every institution type. The app's 'topics led' figure (index.parquet n_topics_led_all) counts, for one institution, the rows of this table carrying that institution_id -- see index.parquet and the app's own Methods page for the resulting skew toward large, multi-site organisations."

  # ---- star_works.parquet ----
  star_works.parquet:
    grain: "one row per star paper -- a work is a star paper for exactly one topic and year, its own PRIMARY topic; 310,327 rows, 6.3 MB zstd. Shipped as a straight byte copy of its own source table, never round-tripped through a dtype-normalising pass: its three id/label columns are `object`, the dtype-policy exception this file's header note names (alongside topics_dim.parquet's three list-typed columns)."
    keys: [work_id]
    columns:
      - {name: work_id, dtype: object, meaning: "OpenAlex work id; primary key. Shipped as a plain string (object), not category -- the dtype-policy exception this file's grain note names."}
      - {name: topic_id, dtype: object, meaning: "the work's PRIMARY topic -- the topic this work was ranked a star paper for. Shipped as a plain string (object), the same exception as work_id."}
      - {name: year, dtype: int16, meaning: "publication year, 2020-2024 -- the year this work was ranked a star paper for"}
      - {name: cited_by, dtype: int32, meaning: "citation count behind the star-paper rule below"}
      - {name: inst_ids, dtype: object, meaning: "pipe-delimited OpenAlex institution ids, every direct-authorship institution named on the work (not restricted to this app's indexed population); a plain, un-split string, the dtype-policy exception this file's header note names. Match one institution by testing for the exact pipe-delimited token (pad with a leading and trailing pipe before matching), never a plain substring search -- one institution id can be a text prefix of another."}
    build_note: "Star-paper rule: per (topic_id, year), k = max(1, ceil(0.01 x count)); the k most-cited world articles and reviews that year are that topic and year's star papers -- the top 1% by citation count within that topic and year, ties beyond k cut. inst_stars.parquet and pair_stars.parquet are this same population, exploded to institution and institution-pair grain and restricted to this app's indexed institutions. Pulled from OpenAlex on 2026-09-03 -- a different date from the OpenAlex harvest snapshot behind every other table in this file; report both vintages in any Methods text, they are not interchangeable."

  # ---- inst_stars.parquet ----
  inst_stars.parquet:
    grain: "one row per (institution_id, topic_id) with n_stars>=1, indexed institutions only; 260,903 rows, 0.58 MB, zstd."
    keys: [institution_id, topic_id]
    columns:
      - {name: institution_id, dtype: category, meaning: null}
      - {name: topic_id, dtype: category, meaning: "the star work's primary topic"}
      - {name: n_stars, dtype: int16, meaning: "count of this institution's star papers (see the star-paper rule below) with this primary topic, articles+reviews, 2020-2024"}
    build_note: "Built from the per-work star-paper pull, exploding each star work's direct institution ids and restricting to indexed institutions. Star-paper rule: per (topic_id, year), k = max(1, ceil(0.01 x count)); the k most-cited world articles/reviews that year are that topic x year's star papers -- the top 1% by citation count within that topic and year, ties beyond k cut. Pulled 2026-09-03."

  # ---- pair_stars.parquet ----
  pair_stars.parquet:
    grain: "one row per unordered indexed pair (a, b), a<b, with >=1 JOINT star paper (both institutions among the work's direct institution ids); 834,488 rows, 1.81 MB, zstd. Largest pair: (I154526488, I4210097159), n_stars=1249."
    keys: [a, b]
    columns:
      - {name: a, dtype: category, meaning: "institution_id, smaller of the pair (same a<b convention as collab_pairs)"}
      - {name: b, dtype: category, meaning: "institution_id, larger of the pair"}
      - {name: n_stars, dtype: int16, meaning: "count of star papers (see inst_stars.parquet's build_note for the rule) that carry BOTH a and b among their direct institution ids, articles+reviews, 2020-2024"}
    build_note: "Built from the same per-work star-paper pull as inst_stars.parquet, restricted to indexed a<b pairs where both institutions are named on the work. Feeds the Relationship block's joint star-paper count and its OpenAlex link, sorted most-cited-first (OpenAlex cannot express a stored top-1% filter directly)."

  # ---- collab_facts.json ----
  # Schema: {med: float (the computed MED = median(r) over the eligible pair population, this
  # run: 1.0430507975155028), w1: [2020,2022], w2: [2023,2024], band: 0.25, alpha: 0.05,
  # elig_min: 10, weak_base_max: 4, new_min_c2: 5, dormant_min_c1: 5, basis: "CORE-AR"}. Every
  # momentum constant used anywhere in Compare/Collaborate (§2.3) is named here ONCE so a UI
  # string never hard-codes a threshold the data build could drift from on a re-run.

# ---- derived_views ----
# ---- scenario_files ----
scenario_files:
  root: "data/scenarios/"
  top_level:
    - {path: "topic_share_frac.npz", shape: [7557, 4516], dtype: float32, order: F, format: sparse_triplet, meaning: "institution x topic share, fractional basis -- tree-INVARIANT (L3/F1 read from topics_all directly, not from any per-scenario derive), stored as a nonzero (row, col, val) triplet and rebuilt dense at load time (9.8% dense; identical values/dtype/order to a dense array, smaller on disk)"}
    - {path: "topic_share_frac_meta.json", meaning: "shape/dtype/order/nnz + the 7 source-table sha256 hashes the substrate was built from (staleness check)"}
    - {path: "topic_share_full.npz", shape: [7557, 4516], dtype: float32, order: F, format: sparse_triplet, meaning: "same, full-counting basis"}
    - {path: "topic_share_full_meta.json", meaning: "same shape as the frac variant's meta.json"}
  common/:
    meaning: "tree- AND basis-invariant blocks (ERC/SDG lens substrates -- these read erc.parquet/sdg.parquet directly, no per-scenario derivation at all), built and stored ONCE, shared by every one of the 6 scenarios"
    files: [l4.npz, l5.npz, l6.npz, l7.npz, meta.json]
  frames_common/{original,conservative,bestfit}/:
    meaning: "fields_df/subfields_df frames CONSOLIDATED across basis (frac and full agree on every column except `si`, which the frame stores twice as `si_frac`/`si_full`) -- built once per tree when a byte-for-byte diff proves the two bases agree (empirically checked at build time, never assumed). subfields_df consolidates on all 3 trees; fields_df consolidates on original/conservative but NOT bestfit (bestfit/frac's fields_df reads the shipped fields.parquet directly, a different source from bestfit/full's derived build -- more than `si` differs there, so it stays a per-scenario file instead, see bestfit_frac//bestfit_full/ below)."
    files: ["subfields_df.parquet (all 3 trees)", "fields_df.parquet (original, conservative only)"]
  "<tree>_<basis>/ (6 folders: original_frac, original_full, conservative_frac, conservative_full, bestfit_frac, bestfit_full)":
    meaning: "per-scenario substrate: L0/L1/L2f arrays (institution x field / institution x subfield share and excess-eligibility matrices, tree- and basis-specific) + a meta.json recording each array's shape/dtype/order and, for fields_df/subfields_df, whether this scenario reads its own file or a frames_common/ shared one (mode: own | shared, with the exact path)"
    files: [l0.npz, l1.npz, l2f.npz, meta.json, "fields_df.parquet (bestfit_frac and bestfit_full only -- own copy, not shared)"]
    shapes:
      original_frac: {l0.share: [7557, 26], l1.share: [7557, 252], l2f.excess: [7557, 252], l2f.eligible: [7557, 252]}
      original_full: {l0.share: [7557, 26], l1.share: [7557, 252], l2f.excess: [7557, 252], l2f.eligible: [7557, 252]}
      conservative_frac: {l0.share: [7557, 26], l1.share: [7557, 246], l2f.excess: [7557, 246], l2f.eligible: [7557, 246]}
      conservative_full: {l0.share: [7557, 26], l1.share: [7557, 246], l2f.excess: [7557, 246], l2f.eligible: [7557, 246]}
      bestfit_frac: {l0.share: [7557, 26], l1.share: [7557, 247], l2f.excess: [7557, 247], l2f.eligible: [7557, 247]}
      bestfit_full: {l0.share: [7557, 26], l1.share: [7557, 247], l2f.excess: [7557, 247], l2f.eligible: [7557, 247]}
    note: "the subfield count differs by tree (252 original, 246 conservative, 247 bestfit) -- expected, the three taxonomy trees genuinely bucket subfields differently; every array within one scenario folder shares that scenario's own subfield count."
  loader: "app/lib/engine/substrates.py::load_substrates(ctx, tree, basis) -> dict -- reconstructs the exact same dict shape (same keys/dtypes/shapes/memory order) the pre-v1.5 in-app build_substrates used to compute on every scenario switch; F1 is derived at load time from the loaded l3 (topic_share) matrix plus topics_dim.top25pct_frontier, never persisted separately (it is an exact column subset of l3, proven by array_equal)."

derived_views:

  per_scenario_fields_subfields:
    what: "fields/subfields shapes for tree in {original, conservative, bestfit} x basis in {frac, full}, other than the shipped (bestfit, frac) pair"
    how: "derived at query time from the shipped topics_all/topics_dim tables (the one topic-grain master), for the requested (tree, basis) pair"
    denominator: "same as the shipped fields/subfields share_frac/share_full (Sigma=1 per institution per scenario); basis='full' si = share_full / mean(share_full over nonzero institutions) -- a DOCUMENTED judgment call (derive.py 'BASIS GENERALIZATION'), not itself present in any shipped table for cross-check. The G6 floor test always reads vol_frac regardless of displayed basis (derive.py 'MEAN-SHARE POPULATION')."

  lens_score_tables:
    what: "L0/L1/L3/F1/L2f/L4/L5/L6(/C1/L7) ranked score tables per seed institution"
    how: "app/lib/engine (Stream B); L1/L3/F1/L2f/L4/L5/L6 read fields/subfields/topics_all/erc/sdg; L0 reads fields; score forms: weighted Jaccard / histogram-intersection (Sigma-min) / excess-profile overlap depending on lens (Method B continuous form, spec_theta=1.5, config.yaml)"
    denominator: "'% of portfolio in common' = the Sigma-min histogram intersection of the two institutions' share vectors in the lens's grain (fields/subfields/topics/ERC-panels/SDGs) under the active scenario; excess-profile overlaps (L2f/L5/L7) additionally floor out cells below their eligibility floor before comparing (L2f: G6 vol_frac>=30 on subfields.si's own floor; L5/L7: erc.si/no-floor-observed and sdg-derived, respectively)."

  concordance:
    what: "found in the top-N of k of n lenses defined for this seed"
    rule: "N=50 (config.yaml's concordance_N key), n = enabled DEFAULT lenses (L0,L1,L3,F1,L2f,L4,L5,L6 = 8 by default; C1/L7 excluded from n unless the user enables them); k/n computed on the UNFILTERED rankings -- post-filters remove rows from the overview display and NEVER recompute k; ties share the rank, top-N cut includes every entry tied at the cut, never padded when fewer than N nonzero candidates exist."

  aspirational:
    what: "L1 top-50 (tie-inclusive) pool filtered to pp_top10_frac > seed's pp_top10_frac AND pp_ci_low > seed's pp_ci_high (both from index.parquet), kept in L1-overlap order"
    how: "intervals rendered, not just point estimates; a PP-sort is a UI option, never the default"

  seed_card:
    fields: "type + type-corrected badge, umbrella badge, country, size (total_full_2020_2024 + total_frac_2020_2024), hhi_class, top fields (shape_field_bestfit, top-3), top subfields (subfields.parquet, top-5 by share_frac at the default scenario), evidence lines (n_eligible_subfields for L2f = count of this institution's subfields with vol_frac>=30; sdg_tagged_share; erc_classified_mass_frac/total_frac_2020_2024; frontier_top25_share; a live-computed catch-all/811 share, lib.engine.catchall_811_share from topics_dim.is_excluded, as its own tooltip), pp_top10_frac with pp_ci_low/pp_ci_high, OpenAlex works link (authorships.institutions.id:<id>,publication_year:2020-2024), ROR link, homepage_url"

  umbrella_badge:
    rule: "type ∈ {government, funder, facility, nonprofit} (on the PATCHED index.type, never type_openalex) AND total_full_2020_2024 > 5x the country x type median (median computed live, over the index, on the SAME patched type column) -- config.yaml's umbrella_badge block, multiplier=5, reference=country_type_median."
    supplement: "UNION with overrides/umbrella_supplement.csv's 24 institution_ids, REGARDLESS of the rule above -- 3 of the 24 (AP-HP, Romanian Academy, Hungarian Research Network) carry a patched type OUTSIDE {government,funder,facility,nonprofit} and would never satisfy the automatic rule; the supplement is how they are still flagged."
    disclosure: "never both the umbrella badge and the type-corrected badge on one row -- checked because both badges read the PATCHED type, so a type-corrected education institution can never also be an umbrella candidate under this rule."

  scale_guard_ratio:
    formula: "max(seed.total_full_2020_2024, candidate.total_full_2020_2024) / min(...) <= ratio"
    ratio: "a single flat ratio (config.yaml scale_guard.ratio, shipped value 3), the SAME cut at every size -- retires the earlier two-band rule (8x below 20,000 full works, 4x at or above it). Opt-in, off by default; the aspirational view is exempt (it is not a size-matched candidate list to begin with)."

  concordance_denominator_disclosure: "the overview caption states N (=50) and n (count of enabled default lenses) explicitly on every render -- never a bare k/n fraction without both numbers spelled out"

  # ---- Additional derived views ----
  baselines_r2:
    what: "Whole-index median + percentile rank for 8 KPIs, computed live by app/lib/baselines.py::build(index.parquet) and cache_resource'd by the page -- NOT a shipped table."
    kpis: [total_full_2020_2024, total_frac_2020_2024, hhi_subfield, breadth_subfields, sdg_tagged_share, frontier_top25_share, pp_top10_frac, bonus_year_full]
    bonus_year_full: "vol_full_by_year_this_run's entry for config.yaml's bonus_year (2025 as shipped), parsed at call time -- not a column."
    percentile_definition: "share of non-null index.parquet values STRICTLY BELOW the institution's own value (0..1); None when the institution's own value is null. Population = institutions with a non-null value for that KPI. The index is dominated by small specialised institutes (median 572 full publications, median breadth 1 subfield at the G6 floor), so the median is a population fact, not a norm -- the UI says so (copy BASELINE_HELP)."
  si_status_r2:
    what: "{solid, thin, none} added to subfields_table/erc_table/sdg_table/fields_table (app/lib/profile_data.py) -- a PROFILE-DISPLAY floor, separate from the ratified G6 lens floor in derive.py (same 30, different purpose, both in force)."
    subfields: "solid: vol_frac >= 30; thin: 10 <= vol_frac < 30; none: vol_frac < 10."
    erc_sdg: "same thresholds on the fractional `mass` column (never on share/si/esi); sdg.parquet is dense, so 'none' genuinely occurs there (zero-mass rows carry no SI mark -- the ERC/SDG zero-volume fix)."
    fields: "solid when vol_frac > 0 and si is not null, else none; fields.si carries no floor, so 'thin' cannot occur at field grain."
    subfields_si_value: "subfields_table's si is RECOMPUTED unfloored (share / mean(share over the rows present in the scenario frame for that subfield) -- derive.py's own mean_share_v population and formula, minus its G6 gate) so a thin row carries a real value; wherever subfields.parquet's floored si is defined the recomputed value equals it within float32 rounding (tests/test_profile_data.py, rtol 1e-5). erc.si and sdg.esi are not recomputed (no floor shipped)."
  rank_volume_r2:
    what: "topics_table gains a 1..n rank by volume on the CURRENT basis (vol_full if basis == full else vol_frac), unique, ties by topic_id -- feeds the frontier panel's 'top N topics by volume' mode; top25pct_frontier is unrelated and not a subset."
  sdg_label_numbered_r2:
    what: "resources/sdg_labels.csv and sdg_table gain sdg_label_numbered = 'SDG {n} · {label}'; sdg_label kept alongside."

  # dynamics_2br (a per-taxon "Dynamics Δ" metric on a since-deleted Compare API,
  # compare_data.metric_frame, and a since-deleted pair page) REMOVED (v1.5, this
  # rebuild): the trimmed Compare surface has no field/subfield/SDG dynamics view any more
  # (the thematic-shape section carries Profile/Impact tabs only, no dynamics tab).
  # the retired pair-topic table / collab_pair_fields.parquet still ship vol_w1/vol_w2
  # (dynamics_window_1/2 above) for the Relationship block's own, unrelated use -- see
  # their own contract entries -- but no derived view builds a per-taxon dynamics figure
  # from them any more.

# ---- Internal working tables (not deployed) ----
# A per-work FWCI table and its subfield x year x type reference table are built and used
# internally to compute the FWCI columns shipped above (collab_pairs.fwci_median,
# collab_pair_fields.fwci_median, the retired pair-topic table's fwci_median) but are not themselves
# deployed to app/data/ and are therefore not part of the contract-checked file set. Their
# reference population is the local EU27+GB/CH/NO/IS harvest (window_conventions.core_ar_window),
# never world OpenAlex -- disclosed in Methods.
