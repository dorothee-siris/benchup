      - {name: a, dtype: category, meaning: "institution_id, smaller of the pair (same a<b convention as collab_pairs)"}
      - {name: b, dtype: category, meaning: "institution_id, larger of the pair"}
      - {name: topic_id, dtype: category, meaning: "OpenAlex topic id (topics_dim.parquet); PRIMARY topic of the joint work only"}
      - {name: vol, dtype: int16, meaning: "RENAMED from v1's vol_total (2BR3 P7, BREAKING -- lib/collab_data.py's module constants JOINT_TOPICS_COLS/FIELD_BREAKDOWN_COLS hard-code the OLD names, flagged to CD4's fence): joint CORE-AR works with this primary topic = vol_w1+vol_w2 (NO vol_2025 term -- CORE-AR has no 2025 component by definition, that column is DROPPED entirely, not just renamed). VERIFIED: this is the exact fix for the '1,882 vs 1,642' basis mismatch named at the plan's own root-cause audit (WT task 6, row 9) -- vol is now type/window-restricted the SAME way n_covered/n_top10 always were."}
      - {name: vol_w1, dtype: int16, meaning: "joint CORE-AR works with this primary topic, WINDOW = 2020-2022 (dynamics window 1, mean annual) (window_conventions.core_ar_window x dynamics_window_1), full counting"}
      - {name: vol_w2, dtype: int16, meaning: "joint CORE-AR works with this primary topic, WINDOW = 2023-2024 (dynamics window 2, mean annual)"}
      - {name: n_sdg, dtype: int16, meaning: "RENAMED from v1's sdg_tagged_n: of vol joint works with this primary topic, how many carry >=1 SDG keyword hit. Same lightweight tagging source as v1 (ALL data/interim/sdg/sdg_shard_*.parquet, tagged = sdg_hits != '' on any shard row)."}
      - {name: n_covered, dtype: int16, meaning: "UNCHANGED convention from v1, now naturally on the CORE-AR population (the type/window restriction is applied at the SOURCE now, not just at the coverage-flag step): of this row's joint works, non-retracted, falling in a (bestfit_subfield_id, year, type) cell that HAS a world threshold T. ALWAYS divide n_top10 by n_covered, never by vol. VERIFIED: n_top10 <= n_covered <= vol on every shipped row, 0 violations (invariants_p7.py)."}
      - {name: n_top10, dtype: int16, meaning: "UNCHANGED convention from v1: of n_covered, how many have cited_by_count >= T (world subfield x year x type top-10% cutoff), same >= convention as agg/impact.py::join_thresholds."}
      - {name: fwci_median, dtype: float32, meaning: "NEW (ruling 4, §2.4, supersedes mean_citations -- see dropped_column note): MEDIAN FWCI over this row's CORE-AR joint works with a valid FWCI value, NULL when < 3 such works. Same reference/method as collab_pairs.fwci_median (fwci_ref.parquet, pipeline-internal)."}
      - {name: mom_class, dtype: category, meaning: "NEW (ruling 6, §2.3): {up, down, stable, ns, new, dormant, weak}, computed from THIS ROW'S c1=vol_w1/c2=vol_w2 against the PARENT PAIR'S d1/d2 (index.total_ar_full_w1/w2[a]+[b]) and the SAME globally-computed MED collab_pairs.parquet uses ('one drift correction per run', §2.3) -- NO z-test at this grain (class only, no mom_rr/mom_p columns here; the UI shows the momentum chip only when this row's vol_w1+vol_w2 >= 10, a DISPLAY rule, not encoded in this column)."}
    dropped_column: "erc_top_panel/erc_top_panel_n/erc_labelled_n (v1's pair-level-but-topic-repeated ERC columns) MOVED to collab_pairs.parquet v2 (their natural pair grain -- WT gap g, closed) and are NO LONGER on this table. mean_citations (v1's impact-proxy column) is SUPERSEDED by fwci_median and dropped entirely, not carried forward."
    build_note: "pipeline/15_collab_pass.py --stage p7-phase2 (`stage_p7_year`, per-work loop restricted to core_total>=5 qualifying pairs, type in {article,review}/2020-2024 applied at the raw-corpus read) -> --stage p7-write (`combine_p7_topics`/`write_p7_topics`, top-100-per-pair truncation by vol, THEN sorted (a,b,topic_id)). Per-year checkpoints under data/interim/collab_p7/ (topics_YYYY.parquet aggregated + fwci_raw_YYYY.parquet raw, isolated from v1's collab_p6/ dir)."

  # ============================================================================================
  # collab_pair_fields.parquet -- pair x field, uncapped, BESTFIT tree only
  # (NEW, 2026-08-31)
  # ============================================================================================
  collab_pair_fields.parquet:
    grain: "v2, ruling 3, 2026-08-31 -- BREAKING rebasis + rename, supersedes the earlier build. One row per (a, b, field_id) for pairs with core_total >= 5 (same CORE-AR floor and qualifying-pair set as collab_pair_topics.parquet v2), UNCAPPED (every field the pair has any joint CORE-AR mass in). 3,571,800 rows, 26.6 MB, zstd. Same eu27_aug+supplement UNION universe, filtered to type in {article,review}, 2020-2024 (window_conventions.core_ar_window) before any row enters this table."
    keys: [a, b, field_id]
    columns:
      - {name: a, dtype: category, meaning: "institution_id, smaller of the pair (same a<b convention as collab_pairs)"}
      - {name: b, dtype: category, meaning: "institution_id, larger of the pair"}
      - {name: field_id, dtype: int16, meaning: "OpenAlex field id (topics_dim.field_id), reached via each joint work's PRIMARY topic -> BESTFIT subfield -> field (tree-independent nesting, unchanged from v1)"}
      - {name: vol, dtype: int16, meaning: "RENAMED from v1's vol_total (BREAKING, same disposition as collab_pair_topics.vol -- CD4's JOINT_ROLLUP_VALUE_COLS/FIELD_BREAKDOWN_COLS constants hard-code the old name, flagged): joint CORE-AR works with primary topic in this field = vol_w1+vol_w2, NO vol_2025 term (dropped, CORE-AR has none)."}
      - {name: vol_w1, dtype: int16, meaning: "joint CORE-AR works with primary topic in this field, WINDOW = 2020-2022 (dynamics window 1, mean annual)"}
      - {name: vol_w2, dtype: int16, meaning: "joint CORE-AR works with primary topic in this field, WINDOW = 2023-2024 (dynamics window 2, mean annual)"}
      - {name: n_top10, dtype: int16, meaning: "same convention as collab_pair_topics.n_top10, rolled up to field grain, now on the CORE-AR population natively (no basis mismatch with vol above -- the exact WT task 6 row-9 fix)."}
      - {name: n_covered, dtype: int16, meaning: "same convention as collab_pair_topics.n_covered, rolled up to field grain. VERIFIED: n_top10 <= n_covered <= vol on all 3,571,800 shipped rows, 0 violations (invariants_p7.py)."}
      - {name: n_sdg, dtype: int16, meaning: "NEW at field grain (2BR3 P7): field-grain rollup of joint CORE-AR works with >=1 SDG keyword hit, same tagging source as collab_pairs.n_sdg / collab_pair_topics.n_sdg."}
      - {name: fwci_median, dtype: float32, meaning: "NEW (ruling 4): MEDIAN FWCI over this row's CORE-AR joint works with a valid FWCI value, NULL when < 3 such works."}
      - {name: mom_class, dtype: category, meaning: "NEW (ruling 6): same rule as collab_pair_topics.mom_class, computed from this row's vol_w1/vol_w2 against the parent pair's d1/d2/MED."}
    dropped_column: "mean_citations (v1's uncapped-table impact proxy, the ONE table that could still afford it after collab_pair_topics dropped it for size) is SUPERSEDED by fwci_median and dropped."
    build_note: "pipeline/15_collab_pass.py --stage p7-phase2 (field-level accumulation runs in the SAME per-work loop as the topic-level one, `stage_p7_year`) -> --stage p7-write (`combine_p7_fields`/`write_p7_fields`); per-year checkpoints under data/interim/collab_p7/fields_YYYY.parquet."

  # ============================================================================================
  # collab_topic_vols.parquet -- pair x topic, UNCAPPED, slim (NEW, 2BR3 P7, ruling 3, §2.2 --
  # the "gaps on capped topics" fix)
  # ============================================================================================
  collab_topic_vols.parquet:
    grain: "one row per (a, b, topic_id) for the SAME core_total>=5 qualifying-pair set as collab_pair_topics.parquet v2, but UNCAPPED (every topic the pair has ANY joint CORE-AR mass in, not just its top-100) -- built for exactly one consumer: lib/collab_data.py's untapped() gaps table, which previously read the top-100-capped collab_pair_topics.parquet and silently read a false 0 (joint_observed) for any shared topic outside a pair's top-100, inflating gap = joint_expected - joint_observed (WT task 5.7). 15,392,404 rows, 36.6 MB, zstd -- WT sized the OLD all-types/2020-2025 basis at 19,234,095 rows/45.57 MB and predicted the CORE-AR basis would be smaller (strict subset); CONFIRMED (WT task 3 basis-delta prediction verified live)."
    keys: [a, b, topic_id]
    columns:
      - {name: a, dtype: category, meaning: "institution_id, smaller of the pair"}
      - {name: b, dtype: category, meaning: "institution_id, larger of the pair"}
      - {name: topic_id, dtype: category, meaning: "OpenAlex topic id; PRIMARY topic of the joint work only, same rule as collab_pair_topics.parquet"}
      - {name: vol, dtype: int32, meaning: "joint CORE-AR works with this primary topic = vol_w1+vol_w2, UNCAPPED (WT recommendation, ratified §0: CORE-AR for consistency with every other 2BR3 Collaborate number -- NOT all-types). Wider dtype than collab_pair_topics.vol (int32 not int16) since a few uncapped cells exceed int16 range on the largest pairs."}
    build_note: "pipeline/15_collab_pass.py --stage p7-write (`write_collab_topic_vols`, sourced from the SAME uncapped `combine_p7_topics()` frame collab_pair_topics.parquet's top-100 truncation reads from -- one shared uncapped intermediate, two different write functions, never two separate aggregation passes). PAIR SET is exactly collab_pairs.parquet's core_total>=5 rows -- VERIFIED as a scripted invariant (invariants_p7.py): set(collab_topic_vols[[a,b]].distinct) == set(collab_pairs[collab_pairs.core_total>=5][[a,b]])."

  # ============================================================================================
  # fwci_taxa.parquet -- institution x grain x taxon (NEW, 2C, stream P8, D2/D3/D14) --
  # per-taxon FWCI aggregates across all FOUR grains D2 asks for, superseding NOTHING (this is
  # the first FWCI table at grain other than pair/field/topic -- collab_pairs.fwci_median etc.
  # are pair-grain, unrelated to this institution-grain table)
  # ============================================================================================
  fwci_taxa.parquet:
    grain: "institution x grain x taxon_id, sparse to n_covered>=3 cells; 703,571 rows, 6.85 MB zstd (field 104,714 / subfield 384,212 / sdg 75,046 / erc 139,599 -- VERIFIED 2026-09-01, matches evals/wind_tunnel_2C/WT_2C.md claim 2's measured magnitudes within the shipped invariants script's +/-10% band; erc came in well under WT's 211,596 upper-bound proxy since that proxy carried no n_covered floor)."
    keys: [institution_id, grain, taxon_id]
    columns:
      - {name: institution_id, dtype: category, meaning: null}
      - {name: grain, dtype: category, meaning: "{field, subfield, sdg, erc} -- four categories, fixed order. field/subfield are BESTFIT-TREE ONLY (pipeline/17_fwci.py derives subfield_id from topics_dim.bestfit_subfield_id, never original/conservative -- WT_2C.md claim 2 adjustment #1): FWCI at these two grains does NOT vary with Compare's tree toggle, and the UI caption/basis chip MUST disclose this (CD5/VC fence, not this table's). sdg taxon_id is the SAME 0-based sdg_idx sdg.parquet/sdg_year.parquet already use (code 'SDG03' -> index 2, SDG17 not covered). erc taxon_id is the SAME 0-based panel_idx erc.parquet already uses (28 panels, erc_tau=0.5 global threshold, config.yaml) -- ERC-grain n_covered has a real, permanent ~7.3% coverage ceiling below field/subfield/sdg (only 92.7% of CORE-AR works have a matching erc_probs.parquet row, WT_2C.md claim 2 adjustment #2), on top of the n_covered<3 floor."}
      - {name: taxon_id, dtype: int32, meaning: "OpenAlex field_id / subfield_id (grain=field/subfield), 0-based sdg_idx (grain=sdg), or 0-based panel_idx (grain=erc) -- interpret ONLY together with `grain`, the same taxon_id integer range is reused across grains (e.g. field_id and sdg_idx both start near 0-30)."}
      - {name: fwci_median, dtype: float32, meaning: "MEDIAN FWCI over this institution's CORE-AR works (articles+reviews, 2020-2024, FULL/binary attribution -- window_conventions.core_ar_window, decisions log 2026-09-01: a work counts ONCE per institution present regardless of collaboration weight) covered by this taxon, floored at n_covered>=3. THE BAR VALUE (D2 ruling: bar=median, hover=mean+n_covered). Compare against fwci_taxa_ref.eu_median_work_fwci for the SAME (grain, taxon_id) -- the two are the SAME statistic (median) over the SAME unit (works), one institution-scoped, one corpus-wide (D3)."}
      - {name: fwci_mean, dtype: float32, meaning: "MEAN FWCI over the SAME population as fwci_median -- hover-only (D2), never the bar. NOT pinned near 1.0 at institution grain the way a full-stratum corpus mean is (WT_2C.md claim 1) -- an institution's own covered-works mean can sit well above or below 1 depending on which subset of the corpus it publishes into. VERIFIED 2026-09-01: computed via an explicit float64 upcast before the groupby mean (numpy float32 sequential-sum vs pairwise-sum divergence -- memory [[numpy-float32-sum-memory-order]] -- closed a real 1-ULP golden mismatch found on the first build)."}
      - {name: n_covered, dtype: int32, meaning: "count of this institution's CORE-AR works (SAME population as fwci_median/fwci_mean) that have a valid FWCI AND fall in this taxon -- the hover denominator (D2) and the D6 hatch-trigger column for FWCI charts (RATIO_HATCH_FLOOR=50 on THIS column, per decisions log 2026-09-01 D6 amendment -- FWCI behaves like PP's n_works_full, genuinely per-row, not like Share's institution-constant denom_value). Floored at >=3 by construction (every shipped row has n_covered>=3); heavy hatching at floor 50 on subfield grain (WT measured ~83% population-wide) is ACCEPTED as honest disclosure, not a bug."}
    build_note: "pipeline/18_fwci_taxa.py --stage field|subfield|sdg|erc then --stage combine (checkpointed per grain under data/interim/fwci/taxa_ckpt/, resume tested 2026-09-01: --stage sdg killed mid-computation before any checkpoint write, confirmed no partial/corrupt file, re-run completed and wrote the checkpoint, a THIRD run logged 'checkpoint present, skip' with a byte-identical sha256). Base joins: fwci_work.parquet (17_fwci.py output, UNTOUCHED -- D14) x topics_dim.parquet (field roll-up) x attribution_long.pkl (institution attribution, weight columns dropped) x corpus_slim.pkl (sdg_hits, exploded via the SAME code->index rule agg/eu_enriched.py:219 uses) x erc_probs.parquet (28-vector probs, deduped preferring the abstract-basis row per agg/enriched_corpus.py:369-371, thresholded via the SAME rule 16_crosses.py:703-706 uses). GOLDEN-VERIFIED 2026-09-01: institution I154202486 (Ifremer) x field_id=11, independently recomputed straight from fwci_work.parquet x attribution_long.pkl (not via this script's own functions) -- byte-identical float32 median (0.8149413466453552), mean (1.3476839065551758) and n_covered (1700). Full invariants + golden script: evals/invariants_fwci_taxa.py (exits non-zero on failure)."

  # ============================================================================================
  # fwci_taxa_ref.parquet -- grain x taxon (NEW, 2C, stream P8, D3) -- the FWCI chart reference
  # line: European corpus-level MEDIAN work-FWCI per grain x taxon, NOT institution-filtered
  # ============================================================================================
  fwci_taxa_ref.parquet:
    grain: "grain x taxon_id, ALL taxa that appear at least once in the CORE-AR corpus (no floor -- contrast with fwci_taxa.parquet's n_covered>=3); 317 rows (field 26, subfield 247, sdg 16, erc 28), 0.01 MB zstd. Dense within each grain's known taxon range (every field/subfield/sdg/erc taxon that exists in this snapshot has a row here)."
    keys: [grain, taxon_id]
    columns:
      - {name: grain, dtype: category, meaning: "{field, subfield, sdg, erc} -- SAME categories/taxon_id convention as fwci_taxa.parquet.grain (read that column's meaning first)."}
      - {name: taxon_id, dtype: int32, meaning: "SAME convention as fwci_taxa.parquet.taxon_id -- interpret only together with `grain`."}
      - {name: eu_median_work_fwci, dtype: float32, meaning: "D3's chart reference: the MEDIAN FWCI over ALL CORE-AR works (articles+reviews, 2020-2024, window_conventions.core_ar_window) mapped to this (grain, taxon_id), across the WHOLE European reference corpus (the local EU27+GB/CH/NO/IS harvest union, same population 17_fwci.py's own fwci_ref.parquet uses -- NEVER world OpenAlex) -- NOT institution-filtered, no attribution_long join at all for this table. Drawn as a per-row varying dashed reference line (D3, same mechanism as REF_METRICS' existing per-row references, charts_compare.py:1791-1817) -- hover/caption copy MUST read 'European median work in this [grain]', NEVER 'average' (the corpus MEAN is pinned to ~1.000 by construction and would misrepresent the skewed distribution as neutral, WT_2C.md claim 1). CAN BE EXACTLY 0.0 on a well-populated taxon -- VERIFIED 2026-09-01: field_id=12 'Arts and Humanities' has eu_median_work_fwci=0.0 on 270,268 works because 62.9% of them have zero citations (a genuine, well-known humanities citation-practice fact, not a defect -- this IS the WT claim 1 finding the D3 ruling itself is built on). 27 (grain, taxon_id) rows total have eu_median_work_fwci==0.0 with n_works>=50 (field: 1; subfield: 23, mostly History/Arts/Literature/Philosophy/Religion subfields; erc: 3, mostly SH panels) -- see evals/invariants_fwci_taxa.py's FYI line for the full list."}
      - {name: n_works, dtype: int64, meaning: "count of CORE-AR works this eu_median_work_fwci was computed over (the corpus-wide denominator, unrelated to any single institution's n_covered)."}
    build_note: "pipeline/18_fwci_taxa.py --stage ref then --stage combine -- SAME four join tables as fwci_taxa.parquet MINUS attribution_long.pkl (no institution split). GOLDEN/invariant-checked alongside fwci_taxa.parquet by evals/invariants_fwci_taxa.py (check #6, softened from the brief's literal '>0' floor to 'finite and >=0' -- see that script's own docstring for the disclosed reason)."

  # ============================================================================================
  # impact_taxa.parquet -- institution x grain x taxon (NEW, 2D, stream P9, E2/E4) --
  # PP10_WD: doc-level top-10%-of-world impact, FULL/BINARY attribution, ALL FOUR grains
  # ============================================================================================
  impact_taxa.parquet:
    grain: "institution x grain x taxon_id, floored at n_covered_pp>=1 (E4: NO display floor lives in the data -- the below-floor CAUTION channel is a UI-layer rendering rule over this same unfloored table, not a second, filtered file). 1,100,275 rows (field 141,654 / 26 distinct fields, subfield 687,618 / 247 distinct subfields, sdg 100,400 / 16 distinct goals, erc 170,603 / 28 distinct panels), 3.28 MB zstd."
    keys: [institution_id, grain, taxon_id]
    columns:
      - {name: institution_id, dtype: category, meaning: null}
      - {name: grain, dtype: category, meaning: "{field, subfield, sdg, erc} -- SAME four categories/fixed order as fwci_taxa.parquet.grain. field/subfield taxon_id is the BESTFIT-TREE subfield/field (topics_dim.bestfit_subfield_id -> field_id) -- SAME tree fwci_taxa.parquet uses at these two grains (18_fwci_taxa.py's own scope decision #2), so the two impact-matrix cells (FWCI_EU, PP10_WD) sit on the identical taxonomic grain and are directly crossable (E2). This is a DELIBERATE CHOICE, found empirically this session (19_impact_taxa.py's own 'TREE NOTE'), not automatic: the per-work top-10% FLAG itself is always decided in the work's ORIGINAL-tree subfield x year x type cohort (D6, unchanged by this note, world_thresholds.parquet's own basis) -- only the GRAIN ROLLUP (which field/subfield cell a flagged work's mass lands in) uses bestfit. sdg taxon_id is the SAME 0-based sdg_idx sdg.parquet/fwci_taxa.parquet already use (SDG17 not covered). erc taxon_id is the SAME 0-based panel_idx erc.parquet/fwci_taxa.parquet already uses (28 panels, erc_tau=0.5 global threshold)."}
      - {name: taxon_id, dtype: int32, meaning: "SAME convention as fwci_taxa.parquet.taxon_id at each grain -- interpret only together with `grain`."}
      - {name: pp10_wd, dtype: float32, meaning: "PP(top10% of WORLD): the fraction of this institution's CORE-AR works (articles+reviews, 2020-2024, window_conventions.core_ar_window), mapped to this (grain, taxon_id) AND covered by a world threshold (see n_covered_pp below), whose cited_by_count_eff is >= the Aug-2026 world_thresholds.parquet threshold T of the work's OWN ORIGINAL subfield x year x type cohort (pipeline/agg/impact.py::join_thresholds, imported not reimplemented -- impact_cells.py L4-8's 'decided exactly once' rule). FULL/BINARY attribution (decisions log 2026-09-01, SAME convention as fwci_taxa.fwci_median/fwci_mean): a work counts ONCE per institution present, regardless of collaboration weight -- a DELIBERATE, DISCLOSED DEPARTURE from the shipped impact_fields.parquet/impact_cells.parquet's pp_top10_frac (FRACTIONAL weight_frac attribution); PP10_WD is a NEW metric name precisely because it is built to cross with FWCI_EU at any grain (E2), not a rename of the existing frac-basis PP. GOLDEN-VERIFIED 2026-09-02 (evals/invariants_impact_taxa.py, three-way): institution I154202486 (Ifremer) x field_id=11 -- n_covered_pp (1699) equals the shipped impact_fields.parquet cell's n_works_full EXACTLY (tree=bestfit, floor=30: same population/tree/flag), while pp10_wd (0.167746, FULL/binary) differs from the shipped pp_top10_frac (0.109063, FRACTIONAL) by a disclosed, expected, attribution-basis-only gap (+0.058683) -- named, not a defect. Also reconciled against ONE live OpenAlex probe (2 filter= calls, funded key, $0.0002): a (subfield, year, type) cohort slice inside this same field cell (Ifremer x subfield 1104 'Aquatic Science' x 2024 x article, T=11) reproduces BOTH the cohort's total covered-work count (34) and its >=threshold count (2) EXACTLY."}
      - {name: n_covered_pp, dtype: int32, meaning: "count of this institution's CORE-AR works, mapped to this (grain, taxon_id), that HAVE a world threshold for their own (ORIGINAL subfield, year, type) cohort -- the pp10_wd DENOMINATOR. A work with no world threshold (0.113% of CORE-AR works are uncovered, WT_2D.md claim 4: 6,389 of 5,652,387) is excluded from BOTH the pp10_wd numerator and this denominator (impact.py's own module-docstring rule), never silently folded into either. Floored at >=1 only (E4) -- NO 10/30 mass-floor gate lives in this table: the shipped impact_fields.parquet/impact_cells.parquet's 10/30-floor variants are a display convention on a DIFFERENT, fractional-mass-attribution table, and a floor stated in fractional-mass units does not translate 1:1 to this column's FULL/binary head-count -- CD6/CH2's below-floor CAUTION channel (E4/E5) reads this raw, unfloored column directly, per-row, rather than reusing impact_fields' own floor variants."}
    build_note: "pipeline/19_impact_taxa.py --stage work (per-CORE-AR-work substrate, data/interim/impact/impact_work.parquet, NOT deployed) then --stage field|subfield|sdg|erc then --stage combine (checkpointed per stage under data/interim/impact/ckpt/, resume tested 2026-09-02: --stage field killed mid-join before any checkpoint write, confirmed no partial/corrupt file on disk, re-run completed and wrote the checkpoint, sha256 byte-identical to a from-scratch build, a THIRD run logged 'checkpoint present, skip'). Base joins IDENTICAL to fwci_taxa.parquet's (pipeline/18_fwci_taxa.py): attribution_long.pkl (FULL/binary, weight columns dropped), corpus_slim.pkl's sdg_hits (same eu_enriched.py:219 code->index rule), erc_probs.parquet (same 16_crosses.py:703-706 tau=0.5 threshold + enriched_corpus.py:369-371 dedup rule) -- PLUS pipeline/agg/impact.py::flag_impact_population/join_thresholds/load_world_thresholds (UNTOUCHED, imported not reimplemented) for the world-threshold flag itself, which fwci_taxa.parquet has no equivalent of. Full invariants + three-way golden: evals/invariants_impact_taxa.py (exits non-zero on failure)."

  # ============================================================================================
  # share_refs.parquet -- grain x taxon x basis (NEW, 2D, stream P9, E8) -- the European
  # mean-of-ratios SHARE reference Compare's Share tab (and SI tabs) read at ALL FOUR grains
  # ============================================================================================
  share_refs.parquet:
    grain: "grain x taxon_id x basis (frac|full), dense within each grain's known taxon range x both bases. 634 rows (field 52 = 26 x 2, subfield 494 = 247 x 2, sdg 32 = 16 x 2, erc 56 = 28 x 2), 0.01 MB zstd."
    keys: [grain, taxon_id, basis]
    columns:
      - {name: grain, dtype: category, meaning: "{field, subfield, sdg, erc} -- SAME taxon_id convention as impact_taxa.parquet/fwci_taxa.parquet at each grain (field/subfield: BESTFIT tree)."}
      - {name: taxon_id, dtype: int32, meaning: "SAME convention as impact_taxa.parquet.taxon_id at each grain."}
      - {name: basis, dtype: category, meaning: "{frac, full} -- the SAME full/frac toggle Compare's basis chip already applies. field/subfield: eu_mean_share genuinely differs by basis (computed independently off fields.parquet/subfields.parquet's own share_frac/share_full columns). sdg/erc: sdg.parquet/erc.parquet ship a SINGLE, non-basis-toggled `share` column (Compare's own Share tab does not basis-toggle these two grains' share value either, profile_data.py's sdg_table/erc_table) -- the IDENTICAL eu_mean_share value is shipped under BOTH basis rows here, disclosed rather than silently duplicated, so a consumer can always join on (grain, taxon_id, basis) without a grain-specific special case."}
      - {name: eu_mean_share, dtype: float32, meaning: "the UNWEIGHTED MEAN-OF-RATIOS European reference: average, across institutions with nonzero mass in this (grain, taxon_id), of each institution's OWN share -- the SAME statistic/population `pipeline/agg/global_layer.py` line 26's SI formula, `profile_data._unfloored_si` (subfield grain) and `compare_data._sdg_share_field_ref_means` (field-grain SDG-share reference) already use, three independent implementations of one convention (WT_2D.md claim 5). field: groupby(field_id).share_frac/share_full.mean() over fields.parquet's own rows (no floor at this grain, matches fields.si's own no-floor population exactly). subfield: SAME over subfields.parquet's rows (UNFLOORED -- matches profile_data._unfloored_si's population, NOT the G6-floored subfields.si column). sdg: MANAGER-RATIFIED 2026-09-02 (WT_2D.md claim 5) to use this SAME mean-of-ratios statistic, filtered to sdg.parquet rows with mass>0 (the dense table's own zero-share rows excluded) -- DELIBERATELY NOT the shipped sdg.esi (a DIFFERENT ratio-of-sums statistic, 'Europe as one pooled institution', per erc_sdg_long.py::build_sdg_long's own `europe_avg` line -- silently reusing esi here would mix two incompatible reference conventions under one 'European mean share' label, WT_2D.md claim 5's own trap). erc: groupby(panel_idx).share.mean() over erc.parquet's own rows (already sparse to nonzero-mass, no extra filter needed, matches erc.si's own no-floor population)."}
    build_note: "pipeline/19_impact_taxa.py --stage refs then --stage combine. Reads fields.parquet/subfields.parquet/erc.parquet/sdg.parquet DIRECTLY (no attribution_long/corpus_slim join -- this table is a pure population statistic over the ALREADY-SHIPPED per-institution share columns, not a per-work rebuild). Invariant-checked by evals/invariants_impact_taxa.py (eu_mean_share in (0,1) on every row; both bases present per grain)."

  # ============================================================================================
  # collab_pair_domain_year.parquet -- pair x OpenAlex domain x year (NEW v1.5, pipeline/22)
  # ============================================================================================
  collab_pair_domain_year.parquet:
    grain: "one row per (a, b, domain_id, year) for pairs with core_total >= 5 (the same CORE-AR qualifying-pair floor as the other pair-grain collab tables), articles+reviews, 2020-2024 (window_conventions.core_ar_window). 6,084,150 rows, 12.35 MB, zstd. Feeds the Relationship block's yearly stacked-by-domain chart."
    keys: [a, b, domain_id, year]
    columns:
      - {name: a, dtype: category, meaning: "institution_id, smaller of the pair (same a<b convention as collab_pairs)"}
      - {name: b, dtype: category, meaning: "institution_id, larger of the pair"}
      - {name: domain_id, dtype: int8, meaning: "OpenAlex domain id (1 Life Sciences, 2 Social Sciences, 3 Physical Sciences, 4 Health Sciences), reached via each joint work's PRIMARY topic -> bestfit field -> domain (topics_dim.parquet, 1:1 map, every field maps to exactly one domain, asserted at build time)"}
      - {name: year, dtype: int16, meaning: "publication year, 2020-2024"}
      - {name: vol, dtype: int32, meaning: "joint CORE-AR works with a primary topic in this domain, this year, full counting. Sums to the pair's collab_pairs.core_total to within a disclosed, expected residual (~0.0099% of total volume across all qualifying pairs): a joint work with NO primary topic contributes to core_total (topic-blind) but not to any topic-grain rollup, including this one -- the same gap collab_pair_fields.parquet and collab_pair_topics.parquet already carry."}
    build_note: "pipeline/22_pair_domain_year.py, rolling data/interim/collab_p7/fields_{2020..2024}.parquet (P7's per-year pair x field checkpoints) up to domain via topics_dim's field->domain map. Written to data/artefacts/ and app/data/."

  # ============================================================================================
  # topic_leaders.parquet -- topic x pool x rank, the world's top publishers per topic (NEW
  # v1.5, pipeline/23, live-pulled from OpenAlex on the run date -- see Methods)
  # ============================================================================================
  topic_leaders.parquet:
    grain: "topic x pool x rank, rank 1..n (n<=200, the OpenAlex group_by page cap) per (topic_id, pool); 1,778,024 rows, 3.93 MB, zstd. Covers all 4,516 topics x 2 pools."
    keys: [topic_id, pool, rank]
    columns:
      - {name: topic_id, dtype: category, meaning: "OpenAlex topic id (topics_dim.topic_id)"}
      - {name: pool, dtype: category, meaning: "{all, education} -- world publisher ranking population for this topic. 'all' = every institution type; 'education' = authorships.institutions.type:education only (the fair-comparison pool, since the 'all' pool is dominated by a handful of very large national research organisations -- see Methods)."}
      - {name: rank, dtype: int16, meaning: "1-based rank by n_works within (topic_id, pool), dense, contiguous, no gaps, capped at 200"}
      - {name: institution_id, dtype: category, meaning: "OpenAlex institution id of the ranked publisher (NOT restricted to this app's 7,557-institution index -- world publishers include non-indexed institutions, e.g. large non-European research organisations)"}
      - {name: display_name, dtype: string, meaning: "OpenAlex display name; populated for rank<=10 only (null beyond, since only the top-10 names are ever shown in the app), and can be null even at rank<=10 on the rare topic where OpenAlex returned no name for that institution id (9 such rows shipped -- the app falls back to the institution id, or this app's own index display_name when the id happens to be an indexed institution)"}
      - {name: n_works, dtype: int32, meaning: "world publication count (articles+reviews, 2020-2024) this rank was computed on; non-increasing with rank within (topic_id, pool)"}
    build_note: "pipeline/23_world_leaders.py, a live OpenAlex sweep (Bearer key + mailto from ~/.siris/.env) over `works?filter=primary_topic.id:{T},publication_year:2020-2024,type:article|review[,authorships.institutions.type:education]&group_by=authorships.institutions.id`. Checkpointed per topic under data/interim/leaders/{topic_id}.json (not deployed). Pulled on 2026-09-03 -- report this vintage in any Methods text alongside the OpenAlex harvest snapshot, they are NOT the same date."

  # ============================================================================================
  # topics_led.parquet -- indexed institution x topic x pool, top-10 world rank only (NEW v1.5,
  # pipeline/25, derived from topic_leaders.parquet, no new API calls)
  # ============================================================================================
  topics_led.parquet:
    grain: "one row per (institution_id, topic_id, pool) where an INDEXED institution (app/data/index.parquet's 7,557) holds rank<=10 in topic_leaders.parquet for that pool; 24,895 rows, 0.07 MB, zstd."
    keys: [institution_id, topic_id, pool]
    columns:
      - {name: institution_id, dtype: category, meaning: "restricted to indexed institutions only (topic_leaders.parquet's own institution_id is unrestricted; this table is the indexed-population slice)"}
      - {name: topic_id, dtype: category, meaning: "OpenAlex topic id"}
      - {name: pool, dtype: category, meaning: "{all, education} -- same convention as topic_leaders.parquet.pool"}
      - {name: rank, dtype: int16, meaning: "1..10 (this table's own floor -- topic_leaders.parquet carries ranks up to 200, this table keeps only the top-10 cut every 'topics led' figure in the app uses)"}
    build_note: "pipeline/25_leader_star_kpis.py, a pure filter of topic_leaders.parquet against index.parquet's institution_id set, rank<=10. 'Topics led' (D6): a topic counts toward n_topics_led_fair using the education pool when the institution's own type is education, the all pool otherwise -- see index.parquet's n_topics_led_fair column and Methods."

  # ============================================================================================
  # inst_stars.parquet -- indexed institution x topic, star-paper counts (NEW v1.5, pipeline/25,
  # derived from the star_papers pull, no new API calls)
  # ============================================================================================
  inst_stars.parquet:
    grain: "one row per (institution_id, topic_id) with n_stars>=1, indexed institutions only; 260,903 rows, 0.58 MB, zstd."
    keys: [institution_id, topic_id]
    columns:
      - {name: institution_id, dtype: category, meaning: null}
      - {name: topic_id, dtype: category, meaning: "the star work's primary topic"}
      - {name: n_stars, dtype: int16, meaning: "count of this institution's star papers (see the star-paper rule below) with this primary topic, articles+reviews, 2020-2024"}
    build_note: "pipeline/25_leader_star_kpis.py, from V4/data/interim/stars/star_works.parquet (not deployed -- pipeline/24_star_papers.py's own output), exploding each star work's '|'-joined direct institution ids and restricting to indexed institutions. Star-paper rule: per (topic_id, year), k = max(1, ceil(0.01 x count)); the k most-cited articles/reviews that year (world, sort=cited_by_count:desc) are the topic x year's star papers -- the top 1% by citation count within that topic and year, ties beyond k cut. Pulled 2026-09-03."

  # ============================================================================================
  # pair_stars.parquet -- indexed institution pair, JOINT star-paper counts (NEW v1.5, pipeline/25)
  # ============================================================================================
  pair_stars.parquet:
    grain: "one row per unordered indexed pair (a, b), a<b, with >=1 JOINT star paper (both institutions among the work's direct institution ids); 834,488 rows, 1.81 MB, zstd. Largest pair: (I154526488, I4210097159), n_stars=1249."
    keys: [a, b]
    columns:
      - {name: a, dtype: category, meaning: "institution_id, smaller of the pair (same a<b convention as collab_pairs)"}
      - {name: b, dtype: category, meaning: "institution_id, larger of the pair"}
      - {name: n_stars, dtype: int16, meaning: "count of star papers (see inst_stars.parquet's build_note for the rule) that carry BOTH a and b among their direct institution ids, articles+reviews, 2020-2024"}
    build_note: "pipeline/25_leader_star_kpis.py, from star_works.parquet's per-work '|'-joined institution id list, restricted to indexed a<b pairs. Feeds the Relationship block's joint star-paper count and its OpenAlex link (sort=cited_by_count:desc on the joint-authorship filter -- see window_conventions / links below, 'most cited first' rather than a stored top-1% filter OpenAlex itself cannot express)."

  # ============================================================================================
  # collab_facts.json -- momentum constants (NEW, 2BR3 P7, §2.2, §2.3). NOT contract-checked
  # (ops/contract_check.py validates parquet + declared .csv only, no JSON support) -- documented
  # here for discoverability, copied to app/data/ alongside the parquet tables by the SAME
  # pipeline stage, but NOT part of the `files:` machinery's automated validation.
  # ============================================================================================
  # Schema: {med: float (the computed MED = median(r) over the eligible pair population, this
  # run: 1.0430507975155028), w1: [2020,2022], w2: [2023,2024], band: 0.25, alpha: 0.05,
  # elig_min: 10, weak_base_max: 4, new_min_c2: 5, dormant_min_c1: 5, basis: "CORE-AR"}. Every
  # momentum constant used anywhere in Compare/Collaborate (§2.3) is named here ONCE so a UI
  # string never hard-codes a threshold the pipeline could drift from on a re-run.

# ================================================================================================
# derived_views -- computed live in-app from the files above, not shipped as files. Listed here
# because the contract between what the data supports and what the UI may claim runs through
# these definitions; every denominator below is either verified against the shipped columns
# here, or traced to a decision-record ruling id.
# ================================================================================================
# ================================================================================================
# scenario_files -- data/scenarios/, the ranking engine's precomputed per-(tree, basis) substrates
# (v1.5, pipeline/21_scenario_substrates.py). NOT contract-checked by ops/contract_check.py's
# column/key machinery above (these are not one-row-per-key tables -- most are numpy arrays
# packed in .npz, not parquet): `ops/deploy.py` copies the whole folder tree and validates it
# structurally against this section (every path below present, and where a shape is given, the
# array's saved shape matches -- read from each folder's own meta.json, never re-derived).
# 150.5 MB total (ops/deploy.py --check-only's own size audit), 40 files, largest single file
# 25.6 MB (topic_share_full.npz) -- comfortably
# under the 95 MB per-file cap.
# ================================================================================================
scenario_files:
  root: "data/scenarios/"
  top_level:
    - {path: "topic_share_frac.npz", shape: [7557, 4516], dtype: float32, order: F, format: sparse_triplet, meaning: "institution x topic share, fractional basis -- tree-INVARIANT (L3/F1 read from topics_all directly, not from any per-scenario derive), stored as a nonzero (row, col, val) triplet and rebuilt dense at load time (9.8% dense; identical values/dtype/order to a dense array, smaller on disk)"}
    - {path: "topic_share_frac_meta.json", meaning: "shape/dtype/order/nnz + the 7 source-table sha256 hashes the substrate was built from (staleness check)"}
    - {path: "topic_share_full.npz", shape: [7557, 4516], dtype: float32, order: F, format: sparse_triplet, meaning: "same, full-counting basis"}
    - {path: "topic_share_full_meta.json", meaning: "same shape as the frac variant's meta.json"}
  common/:
    meaning: "tree- AND basis-invariant blocks (ERC/SDG lens substrates -- these read erc.parquet/sdg.parquet directly, no per-scenario derivation at all), built and stored ONCE, shared by every one of the 6 scenarios"
    files: [l4.npz, l5.npz, l6.npz, l7.npz, meta.json]
  frames_common/{original,conservative,bestfit}/:
    meaning: "fields_df/subfields_df frames CONSOLIDATED across basis (frac and full agree on every column except `si`, which the frame stores twice as `si_frac`/`si_full`) -- built once per tree when the pipeline's own byte-for-byte diff proves the two bases agree (empirically checked at build time, never assumed). subfields_df consolidates on all 3 trees; fields_df consolidates on original/conservative but NOT bestfit (bestfit/frac's fields_df reads the shipped fields.parquet directly, a different source from bestfit/full's derived build -- more than `si` differs there, so it stays a per-scenario file instead, see bestfit_frac//bestfit_full/ below)."
    files: ["subfields_df.parquet (all 3 trees)", "fields_df.parquet (original, conservative only)"]
  "<tree>_<basis>/ (6 folders: original_frac, original_full, conservative_frac, conservative_full, bestfit_frac, bestfit_full)":
    meaning: "per-scenario substrate: L0/L1/L2f arrays (institution x field / institution x subfield share and excess-eligibility matrices, tree- and basis-specific) + a meta.json recording each array's shape/dtype/order and, for fields_df/subfields_df, whether this scenario reads its own file or a frames_common/ shared one (mode: own | shared, with the exact path)"
    files: [l0.npz, l1.npz, l2f.npz, meta.json, "fields_df.parquet (bestfit_frac and bestfit_full only -- own copy, not shared)"]
    shapes:
      original_frac: {l0.share: [7557, 26], l1.share: [7557, 252], l2f.excess: [7557, 252], l2f.eligible: [7557, 252]}
      original_full: {l0.share: [7557, 26], l1.share: [7557, 252], l2f.excess: [7557, 252], l2f.eligible: [7557, 252]}
      conservative_frac: {l0.share: [7557, 26], l1.share: [7557, 246], l2f.excess: [7557, 246], l2f.eligible: [7557, 246]}
      conservative_full: {l0.share: [7557, 26], l1.share: [7557, 246], l2f.excess: [7557, 246], l2f.eligible: [7557, 246]}
      bestfit_frac: {l0.share: [7557, 26], l1.share: [7557, 247], l2f.excess: [7557, 247], l2f.eligible: [7557, 247]}
      bestfit_full: {l0.share: [7557, 26], l1.share: [7557, 247], l2f.excess: [7557, 247], l2f.eligible: [7557, 247]}
    note: "the subfield count differs by tree (252 original, 246 conservative, 247 bestfit) -- expected, the three taxonomy trees genuinely bucket subfields differently; every array within one scenario folder shares that scenario's own subfield count."
  loader: "app/lib/engine/substrates.py::load_substrates(ctx, tree, basis) -> dict -- reconstructs the exact same dict shape (same keys/dtypes/shapes/memory order) the pre-v1.5 in-app build_substrates() used to compute on every scenario switch; F1 is derived at load time from the loaded l3 (topic_share) matrix plus topics_dim.top25pct_frontier, never persisted separately (it is an exact column subset of l3, proven by array_equal)."

derived_views:

  per_scenario_fields_subfields:
    what: "fields/subfields shapes for tree in {original, conservative, bestfit} x basis in {frac, full}, other than the shipped (bestfit, frac) pair"
    how: "pipeline/agg/derive.py:derive_shapes(topics_all, topics_dim, tree, basis) over the shipped topics_all/topics_dim (the one topic-grain master, R2 S2)"
    denominator: "same as the shipped fields/subfields share_frac/share_full (Sigma=1 per institution per scenario); basis='full' si = share_full / mean(share_full over nonzero institutions) -- a DOCUMENTED judgment call (derive.py 'BASIS GENERALIZATION'), not itself present in any shipped table for cross-check. The G6 floor test always reads vol_frac regardless of displayed basis (derive.py 'MEAN-SHARE POPULATION')."

  lens_score_tables:
    what: "L0/L1/L3/F1/L2f/L4/L5/L6(/C1/L7) ranked score tables per seed institution"
    how: "app/lib/engine (Stream B); L1/L3/F1/L2f/L4/L5/L6 read fields/subfields/topics_all/erc/sdg; L0 reads fields; score forms: weighted Jaccard / histogram-intersection (Sigma-min) / excess-profile overlap depending on lens (Method B continuous form, spec_theta=1.5, config.yaml)"
    denominator: "'% of portfolio in common' = the Sigma-min histogram intersection of the two institutions' share vectors in the lens's grain (fields/subfields/topics/ERC-panels/SDGs) under the active scenario; excess-profile overlaps (L2f/L5/L7) additionally floor out cells below their eligibility floor before comparing (L2f: G6 vol_frac>=30 on subfields.si's own floor; L5/L7: erc.si/no-floor-observed and sdg-derived, respectively)."

  concordance:
    what: "found in the top-N of k of n lenses defined for this seed"
    rule: "N=30 (config.yaml proposal_r5.concordance_N, M5.5), n = enabled DEFAULT lenses (L0,L1,L3,F1,L2f,L4,L5,L6 = 8 by default; C1/L7 excluded from n unless the user enables them); k/n computed on the UNFILTERED rankings -- post-filters remove rows from the overview display and NEVER recompute k; ties share the rank, top-N cut includes every entry tied at the cut (L9), never padded when fewer than N nonzero candidates exist."

  aspirational:
    what: "L1 top-50 (tie-inclusive) pool filtered to pp_top10_frac > seed's pp_top10_frac AND pp_ci_low > seed's pp_ci_high (both from index.parquet), kept in L1-overlap order"
    how: "evals/campaign_v2/gen_lists_v2.build_aspirational_v2; intervals rendered, not just point estimates; a PP-sort is a UI option, never the default"

  seed_card:
    fields: "type + type-corrected badge, umbrella badge, country, size (total_full_2020_2024 + total_frac_2020_2024), hhi_class, top fields (shape_field_bestfit, top-3), top subfields (subfields.parquet, top-5 by share_frac at the default scenario), evidence lines (n_eligible_subfields for L2f = count of this institution's subfields with vol_frac>=30; sdg_tagged_share; erc_classified_mass_frac/total_frac_2020_2024; frontier_top25_share; frontier_excluded_share as the catch-all/811 tooltip), pp_top10_frac with pp_ci_low/pp_ci_high, OpenAlex works link (authorships.institutions.id:<id>,publication_year:2020-2024), ROR link, homepage_url"

  umbrella_badge:
    rule: "type ∈ {government, funder, facility, nonprofit} (on the PATCHED index.type, never type_openalex) AND total_full_2020_2024 > 5x the country x type median (median computed live, over the index, on the SAME patched type column) -- config.yaml proposal_r5.umbrella_badge, multiplier=5, reference=country_type_median."
    supplement: "UNION with overrides/umbrella_supplement.csv's 24 institution_ids, REGARDLESS of the rule above -- 3 of the 24 (AP-HP, Romanian Academy, Hungarian Research Network) carry a patched type OUTSIDE {government,funder,facility,nonprofit} and would never satisfy the automatic rule; the supplement is how they are still flagged."
    disclosure: "never both the umbrella badge and the type-corrected badge on one row (WT #14) -- checked because both badges read the PATCHED type, so a type-corrected education institution can never also be an umbrella candidate under this rule."

  scale_guard_ratio:
    formula: "max(seed.total_full_2020_2024, candidate.total_full_2020_2024) / min(...) <= m"
    m: "8 when the SMALLER of the pair is below 20,000 full works; 4 when it is >= 20,000 (config.yaml proposal_r5.scale_guard, M5.6/H15; band-differentiated, a single x5 is NOT band-safe)"

  concordance_denominator_disclosure: "the overview caption states N (=30) and n (count of enabled default lenses) explicitly on every render -- never a bare k/n fraction without both numbers spelled out"

  # ---- Refinement R2 (2026-08-29): derived views added by stream R2-P (text supplied in progress/R2_P.md, applied by the manager) ----
  baselines_r2:
    what: "Whole-index median + percentile rank for 8 KPIs, computed live by app/lib/baselines.py::build(index.parquet) and cache_resource'd by the page -- NOT a shipped table (R2 L31)."
    kpis: [total_full_2020_2024, total_frac_2020_2024, hhi_subfield, breadth_subfields, sdg_tagged_share, frontier_top25_share, pp_top10_frac, bonus_year_full]
    bonus_year_full: "vol_full_by_year_this_run's entry for config.yaml's bonus_year (2025 as shipped), parsed at call time -- not a column."
    percentile_definition: "share of non-null index.parquet values STRICTLY BELOW the institution's own value (0..1); None when the institution's own value is null. Population = institutions with a non-null value for that KPI. The index is dominated by small specialised institutes (median 572 full publications, median breadth 1 subfield at the G6 floor), so the median is a population fact, not a norm -- the UI says so (copy BASELINE_HELP)."
  si_status_r2:
    what: "{solid, thin, none} added to subfields_table/erc_table/sdg_table/fields_table (app/lib/profile_data.py) -- a PROFILE-DISPLAY floor (R2 L34), separate from the ratified G6 lens floor in derive.py (same 30, different purpose, both in force)."
    subfields: "solid: vol_frac >= 30; thin: 10 <= vol_frac < 30; none: vol_frac < 10."
    erc_sdg: "same thresholds on the fractional `mass` column (never on share/si/esi); sdg.parquet is dense, so 'none' genuinely occurs there (zero-mass rows carry no SI mark -- the ERC/SDG zero-volume fix)."
    fields: "solid when vol_frac > 0 and si is not null, else none; fields.si carries no floor, so 'thin' cannot occur at field grain."
    subfields_si_value: "subfields_table's si is RECOMPUTED unfloored (share / mean(share over the rows present in the scenario frame for that subfield) -- derive.py's own mean_share_v population and formula, minus its G6 gate) so a thin row carries a real value; wherever subfields.parquet's floored si is defined the recomputed value equals it within float32 rounding (tests/test_profile_data.py, rtol 1e-5). erc.si and sdg.esi are not recomputed (no floor shipped)."
  rank_volume_r2:
    what: "topics_table gains a 1..n rank by volume on the CURRENT basis (vol_full if basis == full else vol_frac), unique, ties by topic_id -- feeds the frontier panel's 'top N topics by volume' mode (R2 L33); top25pct_frontier is unrelated and not a subset."
  sdg_label_numbered_r2:
    what: "resources/sdg_labels.csv and sdg_table gain sdg_label_numbered = 'SDG {n} · {label}' (R2 L36); sdg_label kept alongside."

  # dynamics_2br (a per-taxon "Dynamics Δ" metric on a since-deleted Compare API,
  # compare_data.metric_frame, and a since-deleted pair page) REMOVED (v1.5, this
  # rebuild): the trimmed Compare surface has no field/subfield/SDG dynamics view any more
  # (D3: the thematic-shape section carries Profile/Impact tabs only, no dynamics tab).
  # collab_pair_topics.parquet / collab_pair_fields.parquet still ship vol_w1/vol_w2
  # (dynamics_window_1/2 above) for the Relationship block's own, unrelated use -- see
  # their own contract entries -- but no derived view builds a per-taxon dynamics figure
  # from them any more.

# ================================================================================================
# pipeline_internal_not_deployed -- artefacts P7 (2BR3) builds and USES to compute the FWCI
# columns shipped above (collab_pairs.fwci_median, collab_pair_fields.fwci_median,
# collab_pair_topics.fwci_median), but does NOT deploy to app/data/ and are therefore NOT part
# of ops/deploy.py's `files:` contract-checked set. Listed here so a future stream does not
# mistake their absence from app/data/ for a missed deliverable.
# ================================================================================================
#   data/interim/fwci/fwci_ref.parquet (subfield_id x year x type; n, mean_cited, fallback_level
#     -- fallback ladder subfield -> field -> year_type when n<50, §2.4): the FWCI reference
#     table itself. 2,327 rows, 0.03 MB. Built by pipeline/17_fwci.py --stage ref.
#   data/interim/fwci/fwci_work.parquet (work_id, fwci, subfield_id, year, type, fallback_level):
#     per-work FWCI for the ENTIRE CORE-AR population (5,655,448 rows, 37.85 MB), not just joint
#     works -- collab_pairs/collab_pair_fields/collab_pair_topics.fwci_median are MEDIANS over
#     the subset of this table whose works are joint CORE-AR works for that pair/field/topic.
#     Built by pipeline/17_fwci.py --stage work. Reference = the local EU27+GB/CH/NO/IS harvest
#     (window_conventions.core_ar_window), NOT world OpenAlex -- disclosed in Methods (MT stream).
