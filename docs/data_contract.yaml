# data_contract.yaml -- the one schema for every file `data/` ships. Machine-readable on
# purpose: `ops/contract_check.py` validates the source tables against this file and FAILS
# NON-ZERO on any undeclared drop, missing column, dtype mismatch, or duplicate key; the
# contract tests (`tests/test_contract*.py`) run the same check.
#
# Every dtype below is the pandas dtype `pd.read_parquet(...)[col].dtype` reports on the
# shipped file itself, never taken from memory or an older schema note.
#
# Conventions
# grain : one row per <grain description>
# keys : primary key columns; uniqueness is a Class-1 invariant (fail_on_key_duplication)
# columns[] : {name, dtype, meaning} -- dtype is the pandas dtype string; for every share/
# percentage/ratio column, `meaning` names the denominator explicitly.
# `derived_views` (bottom): views the app computes at query time, not files on disk -- listed
# here because they are still part of the contract between the shipped data and what the UI
# is allowed to claim.
#
# Current state: 25 declared files (24 parquet tables + 1 override CSV) plus the
# `data/scenarios/` folder (the ranking engine's precomputed per-scenario substrates,
# documented separately in `scenario_files` below -- its members are not one-row-per-key
# tables, so the column/key contract shape does not fit them).
#
# Dtype policy: every object-dtype ID/label column ships as `category` (three list<double>
# period-array columns on topics_dim, and star_works.parquet's work_id/topic_id/inst_ids, are
# the exceptions -- topics_dim's three for unhashable values, star_works.parquet because it
# ships as a straight byte copy of its own source table, never round-tripped through a
# dtype-normalising pass); every float64 column ships as float32; int/Int/bool/category columns
# are untouched.
#
# Size policy: every individual declared or scenario file stays under 95 MB (GitHub's per-file
# limit minus headroom); the whole deploy target (`data/`, scenarios included) stays under
# 700 MB.

contract_version: "1.8"
snapshot: august_2026 # the OpenAlex harvest vintage this file describes
generated_at: "2026-08-27T13:41:28.350794+00:00" # when the source harvest was generated
deploy_target: "data/"

# ------------------------------------------------------------------------------------------------
# window_conventions -- the TWO ratio-window pairs this snapshot mixes. Every share/ratio column
# in `files:` below that divides by one of these MUST name the matching string verbatim (tested).
# ------------------------------------------------------------------------------------------------
window_conventions:
  core_window: "2020-2024 (core window)"
  # index.total_full_2020_2024/total_frac_2020_2024, intl_share, company_share, and the
  # impact/pp_denominator_frac family all use this 5-year analytical window.
  sdg_mass_window: "2020-2025 (SDG mass basis, six-year)"
  # sdg.parquet.share/esi, sdg_year.parquet.mass are ALL denominated
  # on the WHOLE run window (2020-2025, incl. the 2025 bonus year) -- the SDG and ERC classifiers
  # apply no year filter to the corpus they are handed. This is NOT core_window: summing
  # sdg_year.parquet to 2020-2024 only recovers a median 84.96% of sdg.parquet's mass, not 100%
  # -- the two windows must never be silently conflated.
  dynamics_window_1: "2020-2022 (dynamics window 1, mean annual)"
  dynamics_window_2: "2023-2024 (dynamics window 2, mean annual)"
  # the retired pair-topic table's vol_w1/vol_w2; 2025 EXCLUDED from both (bonus-year composition skew,
  # same rule as every other impact-adjacent window).
  core_ar_window: "articles+reviews, 2020-2024, full counting (CORE-AR basis)"
  # The basis for every Collaborate TABLE number (collab_pairs.core_total/c1/c2/n_top10/
  # n_covered/n_sdg/fwci_median/mom_*, collab_pair_fields.parquet, the retired pair-topic table,
  # collab_topic_vols.parquet, index.total_ar_full_w1/w2).
  # NARROWER than core_window on TWO axes at once: type-restricted
  # (article+review only, core_window is all doc types) AND it is core_window's own year span
  # (2020-2024) with full counting only (no fractional variant shipped for the collab tables).
  # Every OpenAlex deep-link for a CORE-AR number carries `type:article|review,
  # publication_year:2020-2024` so link count == displayed count. c1/c2 (dynamics_window_1/2
  # further split WITHIN this basis) are the CORE-AR-basis analogue of vol_w1/vol_w2 at pair
  # grain -- do not confuse with an earlier, all-types vol_w1/vol_w2 convention.

policy:
  fail_on_missing_column: true # a declared column absent from the built table -> FAIL
  fail_on_dtype_mismatch: true # declared dtype != real column dtype -> FAIL
  fail_on_key_duplication: true # declared `keys` not unique in the built table -> FAIL
  fail_on_undeclared_drop: true # a column present in source_manifest.json's table_schemas
                                    # for this table but absent from `columns` below -> FAIL
  fail_on_extra_column: false # a column in the built table not declared here -> logged only

files:

  # ---- index.parquet ----
  index.parquet:
    grain: "one row per index institution (7,557 rows, population_rule: total>=200 works, >=20 in EACH of 2023/2024)"
    keys: [institution_id]
    columns:
      - {name: institution_id, dtype: category, meaning: "OpenAlex institution id (I#########); primary key"}
      - {name: inst_key, dtype: int32, meaning: "0-based row position, ascending; the canonical population order (L14) -- every derived matrix in the app engine is reindexed to this order, tie-breaks in ranking are stable by this position"}
      - {name: ror_id, dtype: category, meaning: "ROR identifier"}
      - {name: display_name, dtype: category, meaning: "OpenAlex display name; seed search primary key"}
      - {name: display_name_acronyms, dtype: category, meaning: "pipe-delimited acronyms; seed search index"}
      - {name: display_name_alternatives, dtype: category, meaning: "pipe-delimited alternative names; seed search index"}
      - {name: type, dtype: category, meaning: "SIRIS-PATCHED institution type (education/facility/company/other/funder/government/healthcare/nonprofit/archive). Differs from type_openalex for exactly the 41 institution_ids listed under 'Type overrides' below (the override list itself is a data-build input, not shipped in this repo). This is the type the app ranks, filters and badges on (never type_openalex)."}
      - {name: type_openalex, dtype: category, meaning: "the ORIGINAL, unpatched OpenAlex type, kept for audit and for the 'type corrected by SIRIS (was: {type_openalex})' badge text. Never changes ranking or inclusion. An older internal schema note omitted this column; the contract follows the real, shipped file."}
      - {name: pool_excluded, dtype: bool, meaning: "True for 3 institution_ids (I4210092262 Romanian Ministry of Education, I4210164678 Shell UK, I4210125590 INESC) -- a funder/regulator surfacing as a performer or the secondary id of a duplicate institution pair (Shell NL/UK, INESC/INESC-ID), False otherwise. Flags a row OUT of lens/aspirational CANDIDATE POOLS only (wired in lib/engine); never removes the row, never changes ranking, denominators or any other column -- excluded rows keep all their data (removing the row outright would shrink the population and move every SI value for everyone else). The exclusion list itself is a data-build input, not shipped in this repo."}
      - {name: country_code, dtype: category, meaning: "ISO 3166-1 alpha-2; perimeter = EU27 + GB/CH/NO/IS (config.yaml perimeter_countries)"}
      - {name: city, dtype: category, meaning: null}
      - {name: homepage_url, dtype: category, meaning: "38 nulls (of 7,557) -- unresolved homepage"}
      - {name: total_full_2020_2024, dtype: float32, meaning: "full (unfractionalized) work count, analytical window 2020-2024 (config.yaml window_analytical). Denominator for the scale-guard band test (max(a,b)/min(a,b) <= 8 below 20k works, <= 4 at/above 20k -- recall_v2.py:722) and for the umbrella-badge size test (> 5x country x type median on this column, PATCHED type basis)."}
      - {name: total_frac_2020_2024, dtype: float32, meaning: "fractional-counted work count, same window"}
      - {name: full_2023, dtype: float32, meaning: "full work count, 2023 only; population_rule 'recent' floor requires >=20 in EACH of 2023 and 2024"}
      - {name: full_2024, dtype: float32, meaning: "full work count, 2024 only"}
      - {name: first_year, dtype: int64, meaning: "first year this institution appears in the corpus"}
      - {name: newcomer_flag, dtype: bool, meaning: "0 True rows in the shipped 7,557 -- no institution in this snapshot is flagged a corpus newcomer"}
      - {name: hhi_subfield, dtype: float32, meaning: "Herfindahl-Hirschman index of the institution's subfield share_frac vector (bestfit tree); feeds hhi_class"}
      - {name: breadth_subfields, dtype: int32, meaning: "count of this institution's subfields with vol_frac >= 30 (the G6 floor of 30 fractional works), verified equal to count(subfields.parquet.vol_frac >= 30) exactly. Not a count of subfields with any nonzero mass -- it is floored at the G6 threshold."}
      - {name: total_full_this_run, dtype: float32, meaning: "run-scoped bookkeeping total (r2 build internals); not a headline KPI"}
      - {name: total_frac_this_run, dtype: float32, meaning: "run-scoped bookkeeping total; not a headline KPI"}
      - {name: total_frac, dtype: float32, meaning: "fractional total across the FULL corpus window used by this run (superset of total_frac_2020_2024's window in some cases) -- verified equal to sum(topics_all.vol_frac) for a spot-checked institution; treat as the denominator when reconciling topics_all against index-level totals"}
      - {name: erc_classified_mass_frac, dtype: float32, meaning: "fractional mass actually assigned an ERC panel; DENOMINATOR of erc.parquet's `share` column (verified: mass/share is constant per institution and equals this column exactly, e.g. 784.2579731515212). The 'ERC-classified share' coverage line (L4/L5) is erc_classified_mass_frac / total_frac -- BOTH on the whole-run mass basis (2020-2025). CORRECTED: dividing by total_frac_2020_2024 mixed bases and printed 109.1 % for Universite de Strasbourg (5,147.74 / 4,716.26); on total_frac (5,590.98) it is 92.1 %, the remainder being grey mass (retracted, unusable, title-only, language-uncertain, untranslated -- the six per-category grey-mass columns themselves shipped in earlier contract versions and were dropped in v1.7, no page ever reading them individually rather than through this one coverage ratio)."}
      - {name: sdg_eligible_mass_frac, dtype: float32, meaning: "fractional mass eligible for SDG classification"}
      - {name: sdg_classified_mass_frac, dtype: float32, meaning: "fractional mass actually run through the SDG classifier (may include works that received ZERO keyword hits, i.e. classified-but-untagged -- see sdg_tagged_share)"}
      - {name: sdg_tagged_share, dtype: float32, meaning: "fraction of sdg_eligible_mass_frac that received AT LEAST ONE SDG keyword hit. Verified: sdg_tagged_share * sdg_eligible_mass_frac == the exact DENOMINATOR of sdg.parquet's per-row `share` column (spot-checked to float32 precision) -- i.e. sdg.share's denominator is the institution's SDG-TAGGED mass, not its classified or eligible mass, matching DESIGN.md's 'any-keyword-hit => 0-N SDGs/doc' semantics (some classified works get 0 tags)."}
      - {name: pp_top10_frac, dtype: float32, meaning: "PP(top10%): fraction of this institution's articles+reviews (2020-2024) that land in the world subfield x year x type top-10% citation threshold. Bootstrapped 95% CI in pp_ci_low/pp_ci_high. Verified: pp_ci_low <= pp_top10_frac <= pp_ci_high holds for all 7,557 rows with a non-null value."}
      - {name: pp_eu_relative, dtype: float32, meaning: "secondary impact metric: EU-relative percentile (free, labeled per DESIGN.md S4; not a top10% flag)"}
      - {name: pp_ci_low, dtype: float32, meaning: "bootstrap 95% CI lower bound on pp_top10_frac"}
      - {name: pp_ci_high, dtype: float32, meaning: "bootstrap 95% CI upper bound on pp_top10_frac"}
      - {name: frontier_top25_share, dtype: float32, meaning: "share of this institution's mass in topics scored in the global top-25% frontier_score (ACCORD); denominator = the institution's frontier-SCORABLE mass (excludes the 811 catch-all exclusion list and any other topic lacking a frontier score for another reason -- topics_dim.is_frontier_scored is false for both)"}
      - {name: frontier_quadrant_mix, dtype: category, meaning: "packed string 'quadrant:share|quadrant:share|...' over {accelerating_expansion, accelerating_contraction, decelerating_expansion, decelerating_contraction}; shares sum to ~1 over the institution's frontier-scored mass"}
      - {name: hhi_class, dtype: category, meaning: "{generalist, focused, specialised} -- discretisation of hhi_subfield"}
      - {name: shape_field_bestfit, dtype: category, meaning: "same packed format, BESTFIT tree (the shipped default scenario tree). v1.7 dropped the ORIGINAL- and CONSERVATIVE-tree siblings of this column (shape_field_original, shape_field_conservative) -- no page ever read a packed field-shape string for either non-default tree; when the app needs an original/conservative field shape it derives it at query time from topics_all.parquet (the topic-grain master table), the same mechanism fields.parquet's own tree column note already documents, not from a second packed string here."}
      - {name: vol_full_by_year_this_run, dtype: category, meaning: "packed string 'YEAR:value|YEAR:value|...', full work counts per year, this run's window (2020-2025 incl. the 2025 bonus year)"}
      - {name: vol_frac_by_year_this_run, dtype: category, meaning: "packed string 'YEAR:value|YEAR:value|...', fractional work counts per year"}
      - {name: intl_share, dtype: float32, meaning: "share of this institution's eligible works, WINDOW = 2020-2024 (core window) (window_conventions.core_window; full counting), with >=1 direct authorship institution whose country_code is non-null AND differs from this institution's own country_code. NOT the sdg_mass_window (2020-2025, six-year) that sdg.parquet/sdg_year.parquet use -- the two windows differ (window_conventions), never conflate them. Denominator = the institution's eligible full-count works 2020-2024, verified equal to total_full_2020_2024 exactly, including for GB/CH/NO/IS institutions. Computed over the union of the harvested corpus for the perimeter countries, with the harvest's own institution-id-overlap rule applied when a work appears in more than one source."}
      - {name: company_share, dtype: float32, meaning: "share of this institution's eligible works, WINDOW = 2020-2024 (core window) (window_conventions.core_window; same denominator as intl_share, NOT the sdg_mass_window), with >=1 direct authorship institution (any, including the focal institution itself) typed 'company' -- type source: corrected index.type for indexed institutions, raw OpenAlex type from inst_meta_all.parquet for the rest."}
      - {name: total_ar_full_w1, dtype: float32, meaning: "full-counted (weight_full=1 per appearing indexed institution) work count, WINDOW = 2020-2022 (dynamics window 1, mean annual) SLICE of window_conventions.core_ar_window (articles+reviews ONLY, NOT total_full_2020_2024's all-doc-types basis). The momentum d1 denominator for a pair (a,b): d1 = total_ar_full_w1[a] + total_ar_full_w1[b] (collab_pairs.mom_rr = (c2/d2)/(c1/d1)). Computed in the same per-year pass as collab_pairs.core_total/c1/c2 -- not derivable from any other shipped index column (total_full_2020_2024 has no type restriction and no window split)."}
      - {name: total_ar_full_w2, dtype: float32, meaning: "same rule as total_ar_full_w1, WINDOW = 2023-2024 (dynamics window 2, mean annual). The momentum d2 denominator."}
      - {name: n_stars, dtype: int32, meaning: "count of this institution's star papers (see inst_stars.parquet's build_note for the rule -- top 1% most-cited within their own topic x year, world, articles+reviews, 2020-2024), 0 when the institution holds none. Equals the sum of this institution's inst_stars.parquet rows exactly."}
      - {name: star_share, dtype: float32, meaning: "ADDITIVE (v1.5): n_stars / (total_ar_full_w1 + total_ar_full_w2) -- a size-free share of the institution's own articles+reviews output, 2020-2024, that are star papers. NULL iff the denominator is 0. Checked range in practice: [0, 0.21] -- one institution (a very small, elite AI lab) sits fractionally above the naive 0.2 sanity ceiling on a tiny denominator; a real ratio, not a computation error (Methods notes the tiny-denominator caveat)."}
      - {name: n_topics_led_all, dtype: int16, meaning: "RECOMPUTED (v1.7): count of topics_led.parquet rows for this institution -- topics where this institution ranks in the world top 20 by publication volume (articles and reviews, 2020-2024), one ranking across every institution type. THE 'topics led' figure the app shows on a profile or a card. v1.7 retires the earlier two-pool, rank<=10 rule: one ranking now covers every institution type, so a large, multi-site research organisation leads disproportionately many topics under this rule -- the app's own Methods page states the skew."}
      - {name: fwci_eu_median, dtype: float32, meaning: "median FWCI_EU (see fwci_taxa.parquet's own column for the full definition -- work-level citation count over the matching European subfield x year x type stratum mean) over this institution's own covered CORE-AR works, ALL subfields pooled -- the institution-level figure the Compare cards show. NULL iff fwci_eu_n is 0 (no covered works)."}
