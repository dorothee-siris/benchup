      - {name: mass_any_full, dtype: float32, meaning: "ADDITIVE (2BR3 P7): full-counted (weight_full) analogue of mass_any_frac, same distinct-tagged population/window/residual convention. VERIFIED 2026-08-31: mass_any_full >= mass_any_frac on all 284,673 rows (weight_full=1 per appearing institution is always >= weight_frac's 0-1 split, 0 exceptions -- a plain arithmetic fact, not a sampled reconciliation)."}
