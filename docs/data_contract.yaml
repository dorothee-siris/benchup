  # ============================================================================================
  # collab_pairs.parquet -- ALL a<b indexed institution pairs (v2, 2BR3 P7, 2026-08-31 --
  # ADDS CORE-AR columns, KEEPS every v1 column unchanged, grain UNCHANGED)
  # ============================================================================================
  collab_pairs.parquet:
    grain: "one row per unordered pair (a,b), a<b by institution_id string, BOTH indexed institutions with >=1 co-published work anywhere 2020-2025 -- UNCHANGED from v1, NO FLOOR, NO ROW CHANGE (3,581,332 rows, 57.9 MB, zstd; the extra width is the 13 new CORE-AR columns, not new rows). Universe = `openalex_eu27_aug` UNION `openalex_supplement` per year, eu27_aug canonical on id overlap, same rule as v1."
    keys: [a, b]
    columns:
      - {name: a, dtype: category, meaning: "institution_id, the lexicographically SMALLER of the pair's two ids (string compare, not ROR/numeric)"}
      - {name: b, dtype: category, meaning: "institution_id, the lexicographically LARGER of the pair's two ids"}
      - {name: copubs_2020, dtype: int32, meaning: "UNCHANGED from v1: co-published works in 2020, ALL DOC TYPES, full counting (a work with N indexed co-authoring institutions contributes 1 to EVERY pair among them, not fractionally split). Feeds ONLY the Collaborate pulse (relationship year-by-year) chart, which stays all-types/2020-2025 by design (§2.1) -- every other Collaborate TABLE number reads the CORE-AR columns below instead."}
      - {name: copubs_2021, dtype: int32, meaning: null}
      - {name: copubs_2022, dtype: int32, meaning: null}
      - {name: copubs_2023, dtype: int32, meaning: null}
      - {name: copubs_2024, dtype: int32, meaning: null}
      - {name: copubs_2025, dtype: int32, meaning: "2025 bonus year (config.yaml bonus_year) -- included in copubs_total, not excluded the way impact indicators exclude it"}
      - {name: copubs_total, dtype: int32, meaning: "UNCHANGED from v1, KEPT (manager ruling 2026-08-31 -- lib/collab_data.py's pulse() reads this column by name; §2.2's prose only listed copubs_2020..2025 but never asked for its removal): SUM(copubs_2020..copubs_2025), all doc types. NOT the CORE-AR basis -- see core_total."}
      - {name: core_total, dtype: int32, meaning: "NEW (2BR3 P7, ruling 3): joint works on window_conventions.core_ar_window (articles+reviews, 2020-2024, full counting) -- c1+c2 exactly. THE denominator basis for every Collaborate TABLE number (replaces copubs_total for anything but the pulse chart). VERIFIED 2026-08-31: an INDEPENDENT from-scratch recompute (pipeline/15_collab_pass.py's own phase-1 pass) matches a second, session-scratchpad probe script byte-for-byte on ALL 3,153,049 CORE-AR pairs (0 mismatches) before this table was written -- see progress/2BR3_P7.md. Strict subset of copubs_total-basis qualifying (WT task 3: CORE-AR floor-5 set is 913,513 pairs, 0 added / 164,927 dropped vs the old all-types floor-5 set)."}
      - {name: c1, dtype: int32, meaning: "NEW: core_total's WINDOW = 2020-2022 (dynamics window 1, mean annual) slice (window_conventions.core_ar_window x dynamics_window_1) -- momentum's numerator-1/denominator-1 raw count."}
      - {name: c2, dtype: int32, meaning: "NEW: core_total's WINDOW = 2023-2024 (dynamics window 2, mean annual) slice -- momentum's numerator-2/denominator-2 raw count."}
      - {name: n_top10, dtype: int32, meaning: "NEW: PAIR-GRAIN rollup (Sigma over the pair's UNCAPPED CORE-AR topic rows, NOT the shipped top-100-capped collab_pair_topics.parquet -- avoids the exact 'gaps on capped topics' undercount pattern named for a different table at WT task 5.7) of works with cited_by_count >= the world subfield x year x type top-10% threshold T, among n_covered. Same >=, not >, convention as agg/impact.py::join_thresholds."}
      - {name: n_covered, dtype: int32, meaning: "NEW: PAIR-GRAIN rollup of CORE-AR joint works landing in a (bestfit_subfield_id, year, type) cell that HAS a world threshold T (world_thresholds.parquet is null on ~24% of cells) AND is not retracted. ALWAYS divide n_top10 by n_covered, never by core_total (mixes windows/undercounts, same WT #7 rule collab_pair_topics.n_covered already documents). Undercounts core_total by the same ~0.07% of works with no primary topic that every topic-grain rollup in this pipeline excludes (topics_dim has no 'no primary topic' bucket) -- disclosed, not silently absorbed."}
      - {name: n_sdg, dtype: int32, meaning: "NEW (RENAMED from collab_pair_topics.parquet v1's sdg_tagged_n, now shipped at PAIR grain instead): PAIR-GRAIN rollup of CORE-AR joint works with >=1 SDG keyword hit (any-hit tagging rule, same lightweight source as v1: ALL data/interim/sdg/sdg_shard_*.parquet, tagged = sdg_hits != '' on ANY shard row for that work_id). Same ~0.07% topicless-work undercount as n_covered/n_top10 above."}
      - {name: fwci_median, dtype: float32, meaning: "NEW (ruling 4, §2.4): MEDIAN FWCI over the pair's CORE-AR joint works with a valid FWCI value (subfield mapped -- ~99.93% of CORE-AR works, WT task 4/17_fwci.py measured), NULL when < 3 such works (§2.4's 'nullable when < 3 covered works', read as 'covered by a valid FWCI value', not the PP-threshold n_covered above -- a DIFFERENT 'covered' concept, disclosed here to head off confusion between the two). FWCI(work) = cited_by_count / mean_cited(subfield x year x type stratum), reference = fwci_ref.parquet (pipeline-internal, NOT deployed -- see its note at the bottom of this file), European reference corpus (this harvest), NOT world. 913,506 / 913,513 CORE-AR floor-5 qualifying pairs have a non-null value (the 7-pair gap: pairs whose few joint works all fall on the topicless/unmapped-subfield edge case)."}
      - {name: rank_in_a, dtype: Int32, meaning: "RECOMPUTED on core_total (was copubs_total in v1, ruling 3): dense rank (1=highest) of `b` among ALL of `a`'s CORE-AR partners, computed BEFORE any floor. NULLABLE (Int32, was non-nullable int32 in v1): a pair present in this table only because it has a copubs_total>=1 (v1's grain) but core_total==0 (no CORE-AR joint work at all) never enters the ranking population -- null, not a fabricated worst-rank tie."}
      - {name: rank_in_b, dtype: Int32, meaning: "same rule, `b`'s own perspective, RECOMPUTED on core_total"}
      - {name: mom_class, dtype: category, meaning: "NEW (ruling 6, §2.3): {up, down, stable, ns, new, dormant, weak} -- momentum classification. Decision tree (see pipeline/15_collab_pass.py::_classify_rr docstring for the full, DISCLOSED priority order the plan text does not fully spell out): new = c1==0 & c2>=5; dormant = c2==0 & c1>=5; weak = 0<c1<5 (thin W1 base, ratio not trusted, no % shown); ns = every other c1==0 case (insufficient signal either window) OR an up/down candidate DEMOTED by the pooled two-proportion z-test (p>=0.05, alpha in collab_facts.json); up = rr>=1.25; down = rr<=0.80; stable = the remaining c1>=5 & c2>=1 rows. The ~428,283 pairs with core_total==0 (present only because copubs_total>=1, v1's grain) are filled 'ns' (no CORE-AR signal at all). Colours/glyphs: MOMENTUM_COLORS (lib/palette.py, PAL stream) -- never a fill alone, always paired with the glyph/text (up-arrow/down-arrow/right-arrow)."}
      - {name: mom_rr, dtype: float32, meaning: "NEW: recentred ratio rr = r/MED where r = (c2/d2)/(c1/d1) (d1/d2 = index.total_ar_full_w1/w2[a]+[b]), MED = median(r) over the ELIGIBLE population (c1>0, c2>0, c1+c2>=10, collab_facts.json elig_min) -- MED=1.0431 this run (VERIFIED in [0.8,1.3], the momentum-sanity HALT band, §3-P7 invariant). NULL whenever c1==0 or d1==0 or d2==0 (r undefined) -- includes new/dormant/most-ns rows by construction, but IS populated for 'weak' rows when computable (a real value, just not display-trusted per the weak-base rule)."}
      - {name: mom_p, dtype: float32, meaning: "NEW: two-sided p-value of the pooled two-proportion z-test on (c1/d1) vs (c2/d2), computed ONLY for rows that were an up/down CANDIDATE before the z-test demotion (rr past the +-25% band) -- NULL for every other row (new/dormant/weak/ns/stable never get a p-value at all, not just an insignificant one). p>=alpha (0.05) demotes the row's mom_class to 'ns' but mom_p itself is never overwritten -- the demoted row's own p-value stays readable as the reason for the demotion."}
      - {name: erc_top_panel, dtype: category, meaning: "CARRIED FORWARD UNCHANGED from collab_pair_topics.parquet v1 (2BR3 §0 ratification, closes WT gap g -- moved from topic-grain to PAIR-grain, still descriptive-header-only, basis unchanged and disclosed): the ERC panel_idx (app/lib/engine/resources/erc_panels.csv) most frequently the work-level argmax(probs) among ALL the pair's joint works on the OLD, ALL-TYPES/2020-2025 basis (NOT recomputed on CORE-AR) -- 'current basis, disclosed' per the ratification's own wording."}
      - {name: erc_top_panel_n, dtype: int32, meaning: "CARRIED FORWARD UNCHANGED, same old (all-types/2020-2025) basis: count of the pair's labelled joint works landing on erc_top_panel."}
      - {name: erc_labelled_n, dtype: int32, meaning: "CARRIED FORWARD UNCHANGED, same old basis: labelled-denominator (works with an erc_probs row at all) -- erc_top_panel_n/erc_labelled_n is 'of the labelled works', never divide by copubs_total or core_total."}
    build_note: "pipeline/15_collab_pass.py --stage p7-phase1 (per-year pair counts + institution CORE-AR full-counted totals, one pass, same dual-accumulation pattern as v1's stage1_year) -> --stage p7-phase2 (topic/field assignment + FWCI join, restricted to the core_total>=5 qualifying set) -> --stage p7-write (assembles + writes all 4 v2 collab_* tables + collab_facts.json + index.parquet's total_ar_full_w1/w2, in that order). Per-year checkpoints under data/interim/collab_p7/ (isolated from v1's collab/ and collab_p6/ checkpoint dirs). v1 columns (a,b,copubs_*,rank_in_a/b as they existed) computed the SAME way as before via the UNCHANGED combine_pairs()/stage1_year functions; only rank_in_a/rank_in_b are overwritten with the CORE-AR recompute."

