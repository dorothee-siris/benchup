# ------------------------------------------------------------------------------------------------
# window_conventions -- the TWO ratio-window pairs this snapshot mixes. Every share/ratio column
# in `files:` below that divides by one of these MUST name the matching string verbatim (tested).
# ------------------------------------------------------------------------------------------------
window_conventions:
  core_window: "2020-2024 (core window)"
  # index.total_full_2020_2024/total_frac_2020_2024, intl_share, company_share, and the
  # impact/pp_denominator_frac family all use this 5-year analytical window.
  sdg_mass_window: "2020-2025 (SDG mass basis, six-year)"
  # sdg.parquet.share/esi, sdg_fields.parquet.mass, sdg_year.parquet.mass are ALL denominated
  # on the WHOLE run window (2020-2025, incl. the 2025 bonus year) -- build_sdg_table/
  # build_erc_table apply no year filter to the corpus they are handed (P3 finding, 2026-08-30).
  # This is NOT core_window: summing sdg_year.parquet to 2020-2024 only recovers a median 84.96%
  # of sdg.parquet's mass, not 100% -- the two windows must never be silently conflated (this is
  # the generalised form of the ERC "109% share" R1 defect).
  dynamics_window_1: "2020-2022 (dynamics window 1, mean annual)"
  dynamics_window_2: "2023-2024 (dynamics window 2, mean annual)"
  # Compare "Dynamics Δ" metric and collab_pair_topics.vol_w1/vol_w2; 2025 EXCLUDED from
  # both (bonus-year composition skew, same rule as every other impact-adjacent window). See
  # derived_views.dynamics_2br below for the full formula and the 0-safe guard.
  core_ar_window: "articles+reviews, 2020-2024, full counting (CORE-AR basis)"
  # 2BR3 ruling 3 (P7): the basis for every Collaborate TABLE number (collab_pairs.core_total/
  # c1/c2/n_top10/n_covered/n_sdg/fwci_median/mom_*, collab_pair_fields.parquet,
  # collab_pair_topics.parquet, collab_topic_vols.parquet, fwci_ref.parquet/fwci_work.parquet,
  # index.total_ar_full_w1/w2) and sdg_fields.parquet v2's mass_any_frac/mass_any_full. NARROWER
  # than core_window on TWO axes at once: type-restricted (article+review only, core_window is
  # all doc types) AND it is core_window's own year span (2020-2024) with full counting only (no
  # fractional variant shipped for the collab tables). Every OpenAlex deep-link for a CORE-AR
  # number carries `type:article|review,publication_year:2020-2024` so link count == displayed
  # count (WT gate condition, 2BR3 §2.1). c1/c2 (dynamics_window_1/2 further split WITHIN this
  # basis) are the CORE-AR-basis analogue of vol_w1/vol_w2 at pair grain -- do not confuse with
  # the ALL-TYPES vol_w1/vol_w2 that collab_pair_topics.parquet v1 shipped.

policy:
  fail_on_missing_column: true     # a declared column absent from the built table -> FAIL
  fail_on_dtype_mismatch: true     # declared dtype != real column dtype -> FAIL
  fail_on_key_duplication: true    # declared `keys` not unique in the built table -> FAIL
  fail_on_undeclared_drop: true    # a column present in source_manifest.json's table_schemas
                                    # for this table but absent from `columns` below -> FAIL
  fail_on_extra_column: false      # a column in the built table not declared here -> logged only

files:

  # ============================================================================================
  # index.parquet -- one row per index institution (the population, L14 population order)
  # ============================================================================================
  index.parquet:
    grain: "one row per index institution (7,557 rows, population_rule: total>=200 works, >=20 in EACH of 2023/2024)"
    keys: [institution_id]
    columns:
      - {name: institution_id, dtype: category, meaning: "OpenAlex institution id (I#########); primary key"}
      - {name: inst_key, dtype: int32, meaning: "0-based row position, ascending; the canonical population order (L14) -- every derived matrix in the app engine is reindexed to this order, tie-breaks in ranking are stable by this position"}
      - {name: ror_id, dtype: category, meaning: "ROR identifier"}
      - {name: display_name, dtype: category, meaning: "OpenAlex display name; seed search primary key"}
      - {name: display_name_acronyms, dtype: category, meaning: "pipe-delimited acronyms; seed search index"}
      - {name: display_name_alternatives, dtype: category, meaning: "pipe-delimited alternative names; seed search index"}
      - {name: type, dtype: category, meaning: "SIRIS-PATCHED institution type (education/facility/company/other/funder/government/healthcare/nonprofit/archive). Differs from type_openalex for exactly the 41 institution_ids in overrides/type_overrides.csv -- see 'Type overrides' below. This is the type the app ranks, filters and badges on (never type_openalex)."}
      - {name: type_openalex, dtype: category, meaning: "the ORIGINAL, unpatched OpenAlex type, kept for audit and for the 'type corrected by SIRIS (was: {type_openalex})' badge text. Never changes ranking or inclusion (config.yaml proposal_r5.type_overrides.changes_ranking_or_inclusion: false). NOT listed in source_manifest.json table_schemas.index -- present in the real file, verified 2026-08-29; manifest is stale on this one column, contract follows the file."}
      - {name: pool_excluded, dtype: bool, meaning: "ADDITIVE (2BR P4, R2-E, 2026-08-30): True for institution_ids listed in overrides/pool_exclusions.csv -- a funder/regulator surfacing as a performer (Romanian Ministry of Education) or the secondary id of a duplicate institution pair (Shell NL/UK, INESC/INESC-ID), False otherwise. Flags a row OUT of lens/aspirational CANDIDATE POOLS only (wired in lib/engine); never removes the row, never changes ranking, denominators or any other column -- excluded rows keep all their data (A6: row removal would shrink the population and move every SI value). See overrides/pool_exclusions.csv for institution_id/canonical_id/reason/source."}
      - {name: country_code, dtype: category, meaning: "ISO 3166-1 alpha-2; perimeter = EU27 + GB/CH/NO/IS (config.yaml perimeter_countries, R2.3/D10)"}
      - {name: city, dtype: category, meaning: null}
      - {name: lat, dtype: float32, meaning: "latitude"}
      - {name: lng, dtype: float32, meaning: "longitude"}
      - {name: homepage_url, dtype: category, meaning: "38 nulls (of 7,557) -- unresolved homepage"}
      - {name: total_full_2020_2024, dtype: float32, meaning: "full (unfractionalized) work count, analytical window 2020-2024 (config.yaml window_analytical). Denominator for the scale-guard band test (max(a,b)/min(a,b) <= 8 below 20k works, <= 4 at/above 20k -- recall_v2.py:722) and for the umbrella-badge size test (> 5x country x type median on this column, PATCHED type basis)."}
      - {name: total_frac_2020_2024, dtype: float32, meaning: "fractional-counted work count, same window"}
      - {name: full_2023, dtype: float32, meaning: "full work count, 2023 only; population_rule 'recent' floor requires >=20 in EACH of 2023 and 2024"}
      - {name: full_2024, dtype: float32, meaning: "full work count, 2024 only"}
      - {name: first_year, dtype: int64, meaning: "first year this institution appears in the corpus"}
      - {name: newcomer_flag, dtype: bool, meaning: "0 True rows in the shipped 7,557 (verified 2026-08-29) -- no institution in this snapshot is flagged a corpus newcomer"}
      - {name: hhi_subfield, dtype: float32, meaning: "Herfindahl-Hirschman index of the institution's subfield share_frac vector (bestfit tree); feeds hhi_class"}
      - {name: breadth_subfields, dtype: int32, meaning: "count of subfields with vol_frac >= 30 (the G6 floor, config.yaml g6_impact_floor / pipeline/agg/trees_agg.G6_FLOOR) for this institution -- VERIFIED 2026-08-29: equals count(subfields.parquet.vol_frac >= 30) exactly on 7 spot-checked institutions (I100063501: 4, I34250744: 58, I4210155399: 1, I2802445252: 11, I4210128123: 3, I4210126694: 2, I2802833755: 1). NOT 'count of subfields with nonzero vol_frac' as an earlier reading of this contract said -- that reading was wrong (152/225 nonzero subfields on the first probe, vs the correct 4 at the G6 floor)."}
      - {name: total_full_this_run, dtype: float32, meaning: "run-scoped bookkeeping total (r2 build internals); not a headline KPI"}
      - {name: total_frac_this_run, dtype: float32, meaning: "run-scoped bookkeeping total; not a headline KPI"}
      - {name: total_frac, dtype: float32, meaning: "fractional total across the FULL corpus window used by this run (superset of total_frac_2020_2024's window in some cases) -- verified equal to sum(topics_all.vol_frac) for a spot-checked institution; treat as the denominator when reconciling topics_all against index-level totals"}
      - {name: mass_retracted_excluded, dtype: float32, meaning: "GREY ACCOUNTING (fractional mass units): mass excluded as retracted. Europe-wide total in source_manifest.json grey_totals_frac_mass.retracted_excluded. Shipped per-institution only, no country x field breakdown -- institution-level only by user ruling 2026-08-29; see ARTEFACT_GAP_AUDIT.md."}
      - {name: mass_unusable, dtype: float32, meaning: "grey accounting: unusable mass (Europe total: grey_totals_frac_mass.unusable). Same institution-level-only ruling as above."}
      - {name: mass_title_only, dtype: float32, meaning: "grey accounting: title-only (no abstract) mass (Europe total: grey_totals_frac_mass.title_only). Same ruling."}
      - {name: mass_lang_uncertain, dtype: float32, meaning: "grey accounting: language-uncertain mass (Europe total: grey_totals_frac_mass.lang_uncertain). Same ruling."}
      - {name: mass_untranslated_grey, dtype: float32, meaning: "grey accounting: untranslated-but-non-English mass (Europe total: grey_totals_frac_mass.untranslated_grey). Same ruling."}
      - {name: mass_classified_eligible, dtype: float32, meaning: "grey accounting: mass that cleared every exclusion and is eligible for classification (Europe total: grey_totals_frac_mass.classified_eligible, 4,618,728.8). Same ruling."}
      - {name: erc_eligible_mass_frac, dtype: float32, meaning: "fractional mass eligible for ERC classification"}
      - {name: erc_classified_mass_frac, dtype: float32, meaning: "fractional mass actually assigned an ERC panel; DENOMINATOR of erc.parquet's `share` column (verified 2026-08-29: mass/share is constant per institution and equals this column exactly, e.g. 784.2579731515212). The 'ERC-classified share' coverage line (L4/L5) is erc_classified_mass_frac / total_frac -- BOTH on the whole-run mass basis (2020-2025). CORRECTED 2026-08-29 (R1, E2 finding): dividing by total_frac_2020_2024 mixed bases and printed 109.1 % for Universite de Strasbourg (5,147.74 / 4,716.26); on total_frac (5,590.98) it is 92.1 %, the remainder being grey mass (retracted, unusable, title-only, language-uncertain, untranslated)."}
      - {name: sdg_eligible_mass_frac, dtype: float32, meaning: "fractional mass eligible for SDG classification"}
      - {name: sdg_classified_mass_frac, dtype: float32, meaning: "fractional mass actually run through the SDG classifier (may include works that received ZERO keyword hits, i.e. classified-but-untagged -- see sdg_tagged_share)"}
      - {name: sdg_tagged_share, dtype: float32, meaning: "fraction of sdg_eligible_mass_frac that received AT LEAST ONE SDG keyword hit. VERIFIED (2026-08-29): sdg_tagged_share * sdg_eligible_mass_frac == the exact DENOMINATOR of sdg.parquet's per-row `share` column (spot-checked to float32 precision) -- i.e. sdg.share's denominator is the institution's SDG-TAGGED mass, not its classified or eligible mass, matching DESIGN.md's 'any-keyword-hit => 0-N SDGs/doc' semantics (some classified works get 0 tags)."}
      - {name: pp_top10_frac, dtype: float32, meaning: "PP(top10%): fraction of this institution's articles+reviews (2020-2024) that land in the world subfield x year x type top-10% citation threshold (DESIGN.md D6). Bootstrapped 95% CI in pp_ci_low/pp_ci_high. VERIFIED (2026-08-29): pp_ci_low <= pp_top10_frac <= pp_ci_high holds for all 7,557 rows with a non-null value."}
      - {name: pp_eu_relative, dtype: float32, meaning: "secondary impact metric: EU-relative percentile (free, labeled per DESIGN.md S4; not a top10% flag)"}
      - {name: pp_ci_low, dtype: float32, meaning: "bootstrap 95% CI lower bound on pp_top10_frac"}
      - {name: pp_ci_high, dtype: float32, meaning: "bootstrap 95% CI upper bound on pp_top10_frac"}
      - {name: frontier_top25_share, dtype: float32, meaning: "share of this institution's mass in topics scored in the global top-25% frontier_score (ACCORD, DESIGN D2); denominator = the institution's frontier-SCORABLE mass (excludes frontier_excluded_share and frontier_unscored_share)"}
      - {name: frontier_quadrant_mix, dtype: category, meaning: "packed string 'quadrant:share|quadrant:share|...' over {accelerating_expansion, accelerating_contraction, decelerating_expansion, decelerating_contraction}; shares sum to ~1 over the institution's frontier-scored mass"}
      - {name: frontier_excluded_share, dtype: float32, meaning: "share of mass in topics on the 811 catch-all exclusion list (no frontier score by construction); denominator = institution total_frac"}
      - {name: frontier_unscored_share, dtype: float32, meaning: "share of mass in topics NOT on the exclusion list but still lacking a frontier score for another reason; denominator = institution total_frac"}
      - {name: hhi_class, dtype: category, meaning: "{generalist, focused, specialised} -- discretisation of hhi_subfield"}
      - {name: shape_field_original, dtype: category, meaning: "packed string 'field_id:share_frac|field_id:share_frac|...', ORIGINAL taxonomy tree, field-level shape"}
      - {name: shape_field_conservative, dtype: category, meaning: "same packed format, CONSERVATIVE tree"}
      - {name: shape_field_bestfit, dtype: category, meaning: "same packed format, BESTFIT tree (the shipped default scenario tree)"}
      - {name: vol_full_by_year_this_run, dtype: category, meaning: "packed string 'YEAR:value|YEAR:value|...', full work counts per year, this run's window (2020-2025 incl. the 2025 bonus year)"}
      - {name: vol_frac_by_year_this_run, dtype: category, meaning: "packed string 'YEAR:value|YEAR:value|...', fractional work counts per year"}
      - {name: intl_share, dtype: float32, meaning: "ADDITIVE (2026-08-30): share of this institution's eligible works, WINDOW = 2020-2024 (core window) (window_conventions.core_window; full counting), with >=1 direct authorship institution whose country_code is non-null AND differs from this institution's own country_code. NOT the sdg_mass_window (2020-2025, six-year) that sdg.parquet/sdg_fields.parquet/sdg_year.parquet use -- the two windows differ (window_conventions), never conflate them. Denominator = the institution's eligible full-count works 2020-2024, VERIFIED equal to total_full_2020_2024 EXACTLY (invariant e, 6/6 institutions incl. 3 GB/CH/NO/IS journey seeds -- ETH Zurich, U. Basel, U. Oxford -- all EXACT). Computed by `pipeline/15_collab_pass.py` over the UNION `data/raw/openalex_eu27_aug/works_20{20..24}.parquet` + `data/raw/openalex_supplement/works_20{20..24}.parquet` (eu27_aug canonical on id overlap -- the same rule `agg.enriched_corpus.load_year_corpus(use_aug_harvest=True)` uses; corrected mid-stream from an eu27_aug-only first pass that undercounted GB/CH/NO/IS institutions, see COSTS.md 2026-08-30)."}
      - {name: company_share, dtype: float32, meaning: "ADDITIVE (2026-08-30): share of this institution's eligible works, WINDOW = 2020-2024 (core window) (window_conventions.core_window; same denominator as intl_share, NOT the sdg_mass_window), with >=1 direct authorship institution (any, including the focal institution itself) typed 'company' -- type source: corrected index.type for indexed institutions, raw OpenAlex type from inst_meta_all.parquet for the rest."}
      - {name: total_ar_full_w1, dtype: float32, meaning: "ADDITIVE (2BR3 P7, ruling 6, 2026-08-31): full-counted (weight_full=1 per appearing indexed institution) work count, WINDOW = 2020-2022 (dynamics window 1, mean annual) SLICE of window_conventions.core_ar_window (articles+reviews ONLY, NOT total_full_2020_2024's all-doc-types basis). The momentum d1 denominator for a pair (a,b): d1 = total_ar_full_w1[a] + total_ar_full_w1[b] (collab_pairs.mom_rr = (c2/d2)/(c1/d1), §2.3). Computed in the SAME per-year pass as collab_pairs.core_total/c1/c2 (pipeline/15_collab_pass.py stage_p7_phase1_year) -- not derivable from any other shipped index column (total_full_2020_2024 has no type restriction and no window split)."}
      - {name: total_ar_full_w2, dtype: float32, meaning: "ADDITIVE (2BR3 P7, ruling 6, 2026-08-31): same rule as total_ar_full_w1, WINDOW = 2023-2024 (dynamics window 2, mean annual). The momentum d2 denominator."}
      - {name: n_stars, dtype: int32, meaning: "ADDITIVE (v1.5, pipeline/25): count of this institution's star papers (see inst_stars.parquet's build_note for the rule -- top 1% most-cited within their own topic x year, world, articles+reviews, 2020-2024), 0 when the institution holds none. Equals the sum of this institution's inst_stars.parquet rows exactly (Class-1 invariant)."}
      - {name: star_share, dtype: float32, meaning: "ADDITIVE (v1.5): n_stars / (total_ar_full_w1 + total_ar_full_w2) -- a size-free share of the institution's own articles+reviews output, 2020-2024, that are star papers. NULL iff the denominator is 0. Checked range in practice: [0, 0.21] -- one institution (a very small, elite AI lab) sits fractionally above the naive 0.2 sanity ceiling on a tiny denominator; a real ratio, not a computation error (Methods notes the tiny-denominator caveat)."}
      - {name: n_topics_led_all, dtype: int16, meaning: "ADDITIVE (v1.5): count of topics_led.parquet rows for this institution, pool='all' -- topics where this institution ranks in the world top 10 by publication volume, 2020-2024, across every institution type."}
