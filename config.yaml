# app/config.yaml -- every run-time threshold and toggle the app applies, in one flat file,
# each key with a one-line comment naming why the value is what it is. Loaded by
# lib/app_config.py into CFG (a dict) -- nothing else reads a config file at app runtime.

lenses:
  default: [L0, L1, L3, F1, L2f, L4, L5, L6]  # the 8 lenses shown on Find by default
  optional: [C1, L7]                          # off by default: C1 is a narrower repeat of L1, L7 tends to run noisy

depth:
  default: 50  # every ranked list shows 50 candidates; the tail is searchable and downloadable
  max: 50      # same as default -- there is no separate, deeper page to load past the top 50

concordance_N: 50  # the concordance counts each lens's top-50, the same depth as every ranked list

scenario:
  tree_default: bestfit  # the best-fit taxonomy repair is the default view; original/conservative are opt-in
  basis_default: frac    # fractional counting is the default view; full counting sits in hover/toggle
  toggles:
    tree: [original, conservative, bestfit]  # the three taxonomy repairs a reader can switch between
    basis: [frac, full]                      # the two counting bases a reader can switch between

scale_guard:
  lt_20k: 8                     # below 20,000 works, two institutions can differ up to 8x in size and still be compared
  ge_20k: 4                     # at or above 20,000 works, the same guard tightens to 4x -- a flat multiplier is not size-safe
  band_threshold_works: 20000   # the size, in full-counted works, where the guard switches from 8x to 4x

umbrella_badge:
  types: [government, funder, facility, nonprofit]  # institution types eligible for the umbrella-organisation badge
  multiplier: 5                                      # an institution over 5x its country/type median size gets the badge
  reference: country_type_median                     # the badge threshold is relative to peers of the same country and type
  basis_column: type  # the badge reads the SIRIS-corrected type -- never the raw OpenAlex type

family_filter_threshold: 0.7  # opt-in post-filter that hides candidates likely to be the seed's own sister institution

type_overrides:
  file: data/overrides/type_overrides.csv                     # the locked list of institutions whose OpenAlex type was corrected
  ui_badge: "type corrected by SIRIS (was: {type_openalex})"  # the badge text shown on a corrected institution

window: [2020, 2024]  # the 5-year analytical window every impact and shape indicator is computed over
bonus_year: 2025       # the extra year shown for trend/volume only, excluded from every impact indicator

perimeter_countries: [at, be, bg, hr, cy, cz, dk, ee, fi, fr, de, gr, hu, ie, it, lv, lt, lu, mt, nl, pl, pt, ro, sk, si, es, se, gb, ch, "no", is]  # the index's country perimeter: EU27 plus the UK, Switzerland, Norway and Iceland

snapshot: august_2026  # the OpenAlex harvest vintage every page reads

g6_floor: 30  # the minimum fractional mass a subfield cell needs before it carries a specialisation-index value

l2f_floor:
  value: 30            # the minimum paper count a subfield needs before it counts toward the shared-specialisations lens
  basis: paper_count   # this floor is counted in papers, not fractional mass -- a deliberate, disclosed choice

erc_tau: 0.5  # the classification-confidence threshold an ERC panel probability must clear to count

corpus_types: [article, review, book, book-chapter, letter]  # document types the underlying harvest includes
openalex_filters: {has_doi: true}  # the harvest only keeps works that carry a DOI

compare_cap: 3  # the hard ceiling on institutions a shareable Compare link can carry
compare_slots: 2  # Compare itself shows two independent search slots, the same matcher Find uses
